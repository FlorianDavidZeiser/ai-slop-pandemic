      if(S.buffs.kampf){S.buffs.kampf=0;$('#battlemsg').textContent='Das gute Essen wirkt noch nach.'}
      S.counters.kaempfe++;saveNow();UI.renderActions();this.startRound();
    };
    const flee=el('button','bigbtn ghost','Lieber nicht');
    flee.onclick=()=>{UI.overlay('ov-battle',false)};
    bb.appendChild(fight);bb.appendChild(flee);
    UI.overlay('ov-battle');
  },
  hp(){
    const me=$('.fighter.me .hpfill'),en=$('.fighter.enemy .hpfill');
    me.style.width=this.st.myHp+'%';en.style.width=this.st.enHp+'%';
    me.classList.toggle('low',this.st.myHp<35);en.classList.toggle('low',this.st.enHp<35);
  },
  abort(){
    const st=this.st;
    if(st){st.await=false;cancelAnimationFrame(st.raf||0);clearTimeout(st.timeout);this.st=null}
    UI.overlay('ov-battle',false);Creature.render();UI.refreshHome();
  },
  startRound(){
    const st=this.st;st.phase='timing';st.round++;
    $('#battleclose').classList.remove('hidden');
    $('#battlebtns').innerHTML='';
    $('#battlemsg').textContent='Runde '+st.round+' — tipp im richtigen Moment!';
    $('#timingwrap').style.visibility='visible';
    // grüne Zone: Breite nach Tempo
    const zoneW=18+10*clamp(effStats(S).tempo/60,0,1);
    const zoneX=15+Math.random()*(70-zoneW);
    st.zone={x:zoneX,w:zoneW};
    const z=$('#timingzone');z.style.left=zoneX+'%';z.style.width=zoneW+'%';z.classList.remove('gold');
    st.cursor=0;st.dir=1;st.await=true;
    const wrap=$('#timingwrap');
    let last=performance.now();
    const speed=0.10+0.02*st.round;
    const loop=(t)=>{
      if(!st.await)return;
      const dt=t-last;last=t;
      st.cursor+=st.dir*speed*dt;
      if(st.cursor>=97){st.cursor=97;st.dir=-1}
      if(st.cursor<=0){st.cursor=0;st.dir=1}
      $('#timingcursor').style.left=st.cursor+'%';
      st.raf=requestAnimationFrame(loop);
    };
    st.raf=requestAnimationFrame(loop);
    wrap.onpointerdown=()=>{ if(!st.await)return; st.await=false;cancelAnimationFrame(st.raf);this.resolveRound() };
    // auch ohne Tipp geht es weiter (der Zeiger pendelt max 6s)
    st.timeout=setTimeout(()=>{if(st.await){st.await=false;cancelAnimationFrame(st.raf);this.resolveRound(true)}},6000);
  },
  resolveRound(auto){
    const st=this.st;clearTimeout(st.timeout);
    const c=st.cursor,z=st.zone;
    const inZone=!auto&&c>=z.x&&c<=z.x+z.w;
    const center=inZone&&Math.abs(c-(z.x+z.w/2))<z.w*0.18;
    const quality=auto?0.55:inZone?(center?1.3:1):0.6;
    if(inZone){$('#timingzone').classList.add('gold');Sound.treffer();vibr(25)}
    const eff=effStats(S),en=st.enemy;
    const myDmg=(12+eff.kraft*0.5)*quality*elemMult(S.element,en.element)*(st.boost||1);
    const enDmg=(8+en.power*0.35)*(0.75+Math.random()*0.4)*elemMult(en.element,S.element);
    const meF=$('.fighter.me'),enF=$('.fighter.enemy');
    meF.classList.add('attack');
    setTimeout(()=>{if(Battle.st!==st)return;
      meF.classList.remove('attack');enF.classList.add('hit');
      st.enHp=clamp(st.enHp-myDmg,0,100);this.hp();
      setTimeout(()=>enF.classList.remove('hit'),420);
    },240);
    $('#battlemsg').textContent=center?'Mitten ins Grüne! Voller Treffer!':inZone?'Getroffen!':'Knapp daneben — ein bisschen Schaden trotzdem.';
    setTimeout(()=>{
      if(Battle.st!==st)return;
      if(st.enHp<=0){this.finish(true);return}
      enF.classList.add('attack');
      setTimeout(()=>{if(Battle.st!==st)return;
        enF.classList.remove('attack');meF.classList.add('hit');
        st.myHp=clamp(st.myHp-enDmg,0,100);this.hp();
        setTimeout(()=>meF.classList.remove('hit'),420);
        setTimeout(()=>{
          if(Battle.st!==st)return;
          if(st.myHp<=0){this.finish(false)}
          else if(st.round>=st.maxRounds){this.finish(st.myHp>=st.enHp)}
          else this.startRound();
        },600);
      },240);
    },1100);
  },
  finish(won){
    const st=this.st;st.phase='done';
    $('#battleclose').classList.add('hidden');
    $('#timingwrap').style.visibility='hidden';
    const bb=$('#battlebtns');bb.innerHTML='';
    if(won){
      S.counters.siege++;
      const g=2+Math.round(Math.random()*2);S.stats.kraft+=g;
      const fk=st.enemy.cost?8+Math.round(Math.random()*4):0;
      if(fk)funkelPlus(S,fk);
      S.needs.laune=clamp(S.needs.laune+8,10,100);
      $('#battlemsg').textContent=st.enemy.sieg+' '+rnd(DATA.welt.microcopy.kampf_sieg);
      const me=$('.fighter.me');me.classList.add('attack');Sound.freude();vibr([30,50,30]);
      if(S.stage>=2)$('#battlemsg').textContent+=' (💪 +'+g+(fk?' · ✦ +'+fk:'')+')';
    } else {
      S.needs.laune=clamp(S.needs.laune-10,10,100);
      $('#battlemsg').textContent=st.enemy.niederlage+' '+rnd(DATA.welt.microcopy.kampf_trost).replace('{name}',S.name);
      Sound.tief();
    }
    S.needs.sauber=clamp(S.needs.sauber-12,10,100);
    saveNow();
    const ok=el('button','bigbtn',won?'Juhu!':'Trösten 💛');
    ok.onclick=()=>{UI.overlay('ov-battle',false);Creature.render();UI.refreshHome();
      if(!won){Creature.nuzzle();UI.toast('Streichel '+S.name+' ein bisschen.')}};
    bb.appendChild(ok);
  },
};
/* ============================================================
   EVOLUTION v2 — vier Stufen, der Knirps kommt früh
   ============================================================ */
const Evo={
  interactions(){const c=S.counters;
    return c.fuetterungen+c.streicheln+c.gewaschen+c.spiele+Math.min(30,c.getobt)+c.gekocht+c.trainiert},
  nextStage(){
    if(!S)return 0;
    const t=nowMs(),h=(t-S.born)/36e5,days=(t-S.born)/864e5;
    if(S.stage===1)return (h>=EVO_KNIRPS_STUNDEN&&this.interactions()>=EVO_KNIRPS_AKTIONEN)?2:0;
    if(S.stage===2)return (days>=EVO_GESTALT_TAGE&&windowOf(t)==='morgen')?3:0;
    if(S.stage===3)return (days>=EVO_WESEN_TAGE&&windowOf(t)==='morgen')?4:0;
    return 0;
  },
  ready(){return this.nextStage()>0},
  pickKnirps(){
    const c=S.counters;
    return (Math.min(60,c.getobt)+c.spiele*2>=c.streicheln*2+c.gekocht*2)?'wach':'ruhig';
  },
  pickForm(){
    const c=S.counters,s=S.stats;
    const maxC=Math.max(1,c.kaempfe,c.spiele,c.traeume,c.streicheln+c.gekocht);
    const maxS=Math.max(1,s.kraft,s.tempo,s.klugheit,s.herz);
    const score={
      wehr:2*c.kaempfe/maxC+s.kraft/maxS,
      flink:2*c.spiele/maxC+s.tempo/maxS,
      traum:2*c.traeume/maxC+s.klugheit/maxS,
      herz:2*(c.streicheln+c.gekocht)/maxC+s.herz/maxS,
    };
    return Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0];
  },
  domCount(key){
    const c=S.counters;
    return {wach:Math.min(99,c.getobt+c.spiele),ruhig:c.streicheln+c.gekocht,
      wehr:c.kaempfe,flink:c.spiele,traum:c.traeume,herz:c.streicheln+c.gekocht}[key]||c.fenster;
  },
  run(done){
    const newStage=this.nextStage();
    if(!newStage)return;
    let knirps=S.knirps,form=S.form,variant=S.variant,variantKey,formsKey;
    if(newStage===2){knirps=this.pickKnirps();variantKey=knirps;formsKey='knirps-'+knirps}
    else if(newStage===3){form=this.pickForm();variantKey=form;formsKey='gestalt-'+form}
    else{
      const n=S.needs;
      variant=((n.satt+n.ausgeruht+n.laune+n.sauber)/4>=60)?'sanft':'wild';
      variantKey=form+'-'+variant;formsKey='wesen-'+form+'-'+variant;
    }
    const rs=DATA2.rueckschau.find(r=>r.stufe===newStage&&r.variant===variantKey);
    const text=(rs?rs.text:'Etwas hat sich verändert.')
      .replace(/\{name\}/g,S.name).replace(/\{n\}/g,String(Math.max(2,this.domCount(newStage===2?knirps:form))));
    const oldOpts={element:S.element,stage:S.stage,knirps:S.knirps,form:S.form,variant:S.variant,look:S.look,glow:'hell',glowOp:1};
    const newOpts={element:S.element,stage:newStage,knirps,form,variant,look:S.look,glow:'hell',glowOp:1};
    $$('.overlay').forEach(o=>o.classList.remove('on'));
    const tx=$('#evotext'),st=$('#evostage'),cp=$('#evocompare'),btn=$('#evonext');
    tx.textContent='';tx.classList.remove('hidden');
    st.classList.add('hidden');st.classList.remove('morph');
    cp.classList.add('hidden');cp.innerHTML='';
    UI.overlay('ov-evo');
    let phase=0,i=0;btn.style.visibility='hidden';
    const type=()=>{ if(i<=text.length){tx.textContent=text.slice(0,i);i+=2;setTimeout(type,34)} else btn.style.visibility='visible'; };
    setTimeout(type,600);
    btn.onclick=()=>{
      if(phase===0){
        phase=1;tx.classList.add('hidden');btn.style.visibility='hidden';
        st.classList.remove('hidden');
        st.querySelector('.eold').innerHTML=svgWesen(oldOpts);
        st.querySelector('.enew').innerHTML=svgWesen(newOpts);
        Sound.freude();
        setTimeout(()=>{st.classList.add('morph');vibr([40,80,40,80,120]);},700);
        setTimeout(()=>{btn.style.visibility='visible';btn.textContent='Weiter'},3400);
      } else if(phase===1){
        phase=2;st.classList.add('hidden');
        cp.classList.remove('hidden');
        const neuName=(()=>{const tmp={stage:newStage,knirps,form,variant};return formNameOf(tmp)})();
        cp.innerHTML=`<div class="half">${svgWesen(oldOpts)}<div style="color:#cfd8f2;font-size:.85em">vorher</div></div>
          <div class="arrow">→</div>
          <div class="half">${svgWesen(newOpts)}<div style="color:#fff;font-weight:800">${neuName}</div></div>`;
        btn.textContent='Hallo, '+S.name;
      } else {
        S.stage=newStage;S.knirps=knirps;S.form=form;S.variant=variant;
        if(!S.formsSeen.includes(formsKey))S.formsSeen.push(formsKey);
        S.chronicle.push({t:nowMs(),stage:newStage,key:formsKey,name:formNameOf(S),text});
        if(newStage===2&&!S.seen.stufe2){S.seen.stufe2=true;
          setTimeout(()=>UI.toast('Neu: Zahlen und Werte, Kämpfe am Abend unter „Mehr“.',4200),2600)}
        if(newStage===3&&!S.seen.stufe3){S.seen.stufe3=true;
          setTimeout(()=>UI.toast('Neu: Freundescode und Statistik unter „Mehr“.',4200),2600)}
        saveNow();
        UI.overlay('ov-evo',false);
        Creature.render();Creature.hop();UI.refreshHome();
        btn.textContent='Weiter';
        setTimeout(()=>FormMap.open(),900); // die Karte zeigt das neue Feld
        if(done)done();
      }
    };
  },
};

const Cave={
  drag:null,
  open(){

  render(){
    const look=CAVE_LOOKS[S.cave.id]||CAVE_LOOKS.erdmulde;

    $('#cavefloor').style.background=look.floor;

    if(S.cave.id==='sternenspalte'){
      for(let i=0;i<14;i++){const st=el('div','star');
        st.style.cssText=`position:absolute;left:${Math.random()*100}%;top:${Math.random()*30}%;width:2.5px;height:2.5px;animation-delay:${Math.random()*3}s`;
        wrap.appendChild(st)}
    }
    S.cave.items.forEach((it,idx)=>{
      const d=objDef(it.id);if(!d)return;
      const o=el('div','caveobj',d.emoji+(S.pot&&it.id==='kochtopf'?'<span style="position:absolute;top:-14px;left:12px;font-size:20px">💨</span>':''));
      o.style.left=(it.x*100)+'%';o.style.top=(it.y*100)+'%';
      o.dataset.idx=idx;
      o.addEventListener('pointerdown',e=>this.down(e,o,idx));
      wrap.appendChild(o);
    });
  },
  down(e,o,idx){
    e.preventDefault();
    this.drag={o,idx,x0:e.clientX,y0:e.clientY,moved:false};
    o.classList.add('dragging');
    const move=ev=>{
      const d=this.drag;if(!d)return;
      if(Math.hypot(ev.clientX-d.x0,ev.clientY-d.y0)>8)d.moved=true;
      const r=$('#scr-cave').getBoundingClientRect();
      d.o.style.left=(clamp((ev.clientX-r.left)/r.width,0.06,0.94)*100)+'%';
      d.o.style.top=(clamp((ev.clientY-r.top)/r.height,0.24,0.9)*100)+'%';
      const tr=$('#cavetrash').getBoundingClientRect();
      $('#cavetrash').classList.toggle('hot',ev.clientX>tr.left-16&&ev.clientY>tr.top-16);
    };
    const up=ev=>{
      document.removeEventListener('pointermove',move);
      document.removeEventListener('pointerup',up);
      const d=this.drag;this.drag=null;if(!d)return;
      d.o.classList.remove('dragging');
      $('#cavetrash').classList.remove('hot');
      const it=S.cave.items[d.idx];
      if(!d.moved){ // Antippen
        if(it.id==='kochtopf')Cook.open();
        else{const r=d.o.getBoundingClientRect();UI.pop(r.left+22,r.top,'✨');Sound.plink()}
        return;
      }
      const tr=$('#cavetrash').getBoundingClientRect();
      if(ev.clientX>tr.left-16&&ev.clientY>tr.top-16&&it.id!=='kochtopf'){
        S.cave.items.splice(d.idx,1); // zurück ins Lager
        UI.toast(objDef(it.id).name+' ist im Lager. Im Laden holst du es wieder raus.');
      } else {
        const r=$('#scr-cave').getBoundingClientRect();
        it.x=clamp((ev.clientX-r.left)/r.width,0.06,0.94);
        it.y=clamp((ev.clientY-r.top)/r.height,0.24,0.9);
      }
      saveNow();this.render();
    };
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
  },
  /* Eingerichtetes taucht auch draußen vor der Höhle auf */
  renderHomeProps(){

      if(it.id==='kochtopf'){o.style.fontSize='32px';o.onclick=()=>Cook.open();

  fire(){
    if(S.pot||this.slots.length<2)return;
    const zut=[...this.slots].sort();
    zut.forEach(id=>{S.inventory[id]=Math.max(0,(S.inventory[id]||0)-1)});
    const rec=DATA2.rezepte.find(r=>[...r.zutaten].sort().join('+')===zut.join('+'));
    const minuten=(rec?rec.kochzeit:15)*caveMods(S).kochMul;

    Cave.renderHomeProps();
    if(UI.screen==='cave')Cave.render();

  },
  /* wird aus Tick/Catchup aufgerufen, wenn der Topf fertig ist */
  complete(st){
    const pot=st.pot;st.pot=null;
    if(!pot)return null;
    let neu=false;
    if(pot.rezept==='matsch'){
      st.dishes.matsch=(st.dishes.matsch||0)+1;
    } else {
      st.dishes[pot.rezept]=(st.dishes[pot.rezept]||0)+1;
      if(!st.recipes.includes(pot.rezept)){st.recipes.push(pot.rezept);neu=true;funkelPlus(st,10);}
    }
    st.counters.gekocht++;
    return {rezept:pot.rezept,neu};
  },
  announce(res){
    if(!res)return;
    if(res.rezept==='matsch'){UI.toast(rnd(DATA2.matsch.saetze),3600);Sound.blubb();}
    else if(res.neu){

      UI.toast(r.name+' ist fertig. Duftet.',3000);Sound.freude();
    }
    UI.renderDrawer();Cave.renderHomeProps();
    if(UI.screen==='cave')Cave.render();
    if($('#ov-cook').classList.contains('on'))Cook.renderPot();
  },
};

/* ---------- Entstehungsritual: der Zauberkessel ---------- */
const Ritual={
  pid:null,taps:0,chosen:[],stirring:false,wind:0,lastA:null,
  svgKessel(glow){
    return `<svg viewBox="0 0 220 200">
      <defs><radialGradient id="kgl"><stop offset="0%" stop-color="${glow||'#8fa8d8'}" stop-opacity=".85"/>
        <stop offset="100%" stop-color="${glow||'#8fa8d8'}" stop-opacity="0"/></radialGradient></defs>
      <ellipse cx="110" cy="188" rx="70" ry="9" fill="rgba(0,0,0,.4)"/>
      <path d="M30,70 Q30,175 110,175 Q190,175 190,70 Z" fill="#2e3348"/>
      <path d="M30,70 Q30,150 110,150" fill="none" stroke="#232840" stroke-width="8" opacity=".6"/>
      <ellipse cx="110" cy="70" rx="80" ry="20" fill="#3c4260"/>
      <ellipse cx="110" cy="68" rx="66" ry="14" fill="#151a2e" class="kessel-mund"/>
      <ellipse cx="110" cy="68" rx="60" ry="12" fill="url(#kgl)" class="kessel-glow"/>
      <path d="M52,168 L40,188 M168,168 L180,188" stroke="#232840" stroke-width="10" stroke-linecap="round"/>
    </svg>`;
  },
  start(pid){
    this.pid=pid;this.taps=0;this.chosen=[];this.stirring=false;this.wind=0;this.lastA=null;
    $('#kessel').innerHTML=this.svgKessel();
    $('#kesselslots').innerHTML='';
    $('#kesselzutaten').classList.remove('on');
    $('#stirbtn').classList.add('hidden');
    $('#ritualhint').textContent='Da steht ein alter Kessel. Tipp ihn an.';
    UI.show('ritual');
    const k=$('#kessel');
    k.onpointerdown=e=>this.tapKessel(e);
    k.onpointermove=e=>this.stir(e);
  },
  tapKessel(e){
    if(this.chosen.length>=3){this.stirring=true;this.stir(e);return}
    this.taps++;
    const k=$('#kessel');
    k.classList.remove('wobble');void k.offsetWidth;k.classList.add('wobble');
    Sound.blubb();vibr(20);
    this.bubble();
    if(this.taps===1)$('#ritualhint').textContent='Es blubbert. Da will etwas werden.';
    if(this.taps>=2&&!$('#kesselzutaten').classList.contains('on')){
      $('#ritualhint').textContent='Wirf drei Dinge hinein. Was du mischst, bestimmt, wer kommt.';
      this.renderZutaten();this.renderSlots();
    }
  },
  bubble(col){
    const k=$('#kessel').getBoundingClientRect();
    for(let i=0;i<3;i++){
      const b=el('div','kbubble');
      const sz=6+Math.random()*12;
      b.style.cssText=`left:${k.left-UI.appLeft()+60+Math.random()*90}px;top:${k.top+46}px;width:${sz}px;height:${sz}px;background:${col||'#8fa8d8'};opacity:.8`;
      $('#app').appendChild(b);setTimeout(()=>b.remove(),1600);
    }
  },
  renderZutaten(){
    const wrap=$('#kesselzutaten');wrap.innerHTML='';wrap.classList.add('on');
    DATA2.zutaten.forEach(z=>{
      const fi=el('button','fooditem'+(this.chosen.includes(z.id)?' used':''));
      fi.innerHTML=`<span>${z.emoji}</span><small>${z.name}</small>`;
      fi.onclick=()=>this.pick(z);
      wrap.appendChild(fi);
    });
  },
  renderSlots(){
    const ps=$('#kesselslots');ps.innerHTML='';
    for(let i=0;i<3;i++){
      const z=this.chosen[i];
      const sl=el('div','potslot'+(z?' filled':''),z?zutDef(z).emoji:'·');
      if(z)sl.onclick=()=>{this.chosen.splice(i,1);this.renderZutaten();this.renderSlots();
        $('#ritualhint').textContent='Wirf drei Dinge hinein.';$('#stirbtn').classList.add('hidden')};
      ps.appendChild(sl);
    }
  },
  pick(z){
    if(this.chosen.length>=3||this.chosen.includes(z.id))return;
    this.chosen.push(z.id);
    Sound.blubb();vibr(15);
    this.bubble(ELEMENTS[ZUTAT_ELEMENT[z.id]].farbe);
    this.renderZutaten();this.renderSlots();
    if(this.chosen.length===3){
      $('#ritualhint').textContent='Jetzt rühr um! Mal mit dem Finger Kreise über dem Kessel.';
      setTimeout(()=>{if(this.chosen.length===3&&!this.brewed)$('#stirbtn').classList.remove('hidden')},6000);
      $('#stirbtn').onclick=()=>this.brew();
      const brew=brewLook(this.chosen);
      const g=$('#kessel .kessel-glow');
      if(g)g.setAttribute('fill','url(#kgl)');
      this.bubble(ELEMENTS[brew.element].farbe);
    }
  },
  stir(e){
    if(this.chosen.length<3||this.brewed)return;
    const k=$('#kessel').getBoundingClientRect();
    const a=Math.atan2(e.clientY-(k.top+k.height/2),e.clientX-(k.left+k.width/2));
    if(this.lastA!=null){
      let da=a-this.lastA;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;
      this.wind+=da;
      if(Math.random()<0.2)this.bubble(ELEMENTS[brewLook(this.chosen).element].farbe);
      if(Math.abs(this.wind)>2.6*Math.PI)this.brew();
    }
    this.lastA=a;
  },
  brewed:false,
  brew(){
    if(this.brewed||this.chosen.length<3)return;
    this.brewed=true;
    $('#stirbtn').classList.add('hidden');
    $('#kesselzutaten').classList.remove('on');
    $('#kesselslots').innerHTML='';
    const res=brewLook(this.chosen);
    this._brew=res;
    const E=ELEMENTS[res.element];
    Sound.fanfare();vibr([50,80,50,80,140]);
    for(let i=0;i<10;i++)setTimeout(()=>this.bubble(E.farbe),i*140);
    const k=$('#kessel');
    k.innerHTML=this.svgKessel(E.farbe);
    // der neue Glimmling steigt aus dem Kessel
    const rise=el('div','');
    rise.style.cssText='position:absolute;left:50%;top:30%;width:170px;height:170px;transform:translate(-50%,40px) scale(.2);opacity:0;transition:all 1.6s cubic-bezier(.3,1.3,.5,1);z-index:5';
    rise.innerHTML=svgWesen({element:res.element,stage:1,look:res.look,glow:'hell',glowOp:1});
    $('#scr-ritual').appendChild(rise);
    this._rise=rise;
    requestAnimationFrame(()=>{rise.style.transform='translate(-50%,-40px) scale(1)';rise.style.opacity='1'});
    $('#ritualhint').textContent='Da ist es. Ganz neu und schon ganz deins.';
    setTimeout(()=>{
      $('#nameinput').value='';
      UI.overlay('ov-name');
      setTimeout(()=>{try{$('#nameinput').focus()}catch(e){}},300);
    },2200);
  },
  finish(name){
    const res=this._brew||brewLook(this.chosen.length?this.chosen:['sonnenbeere','moosknolle','wildhonig']);
    const st=newState(name,res.element,res.look,[...this.chosen]);
    this.chosen.forEach(id=>{const z=zutDef(id);if(z)st.stats[z.stat]+=2}); // die Mischung prägt die Anlagen
    st.favourite=rnd(DATA2.rezepte).id;
    save(this.pid,st);
    meta.profiles[this.pid]=name;saveMeta();
    if(this._rise){this._rise.remove();this._rise=null}
    this.brewed=false;
    UI.overlay('ov-name',false);
    Boot.enter(this.pid,true);
  },
};

/* ============================================================
   BOOT v2: Verdrahtung, Zeittakt, Debug, PWA
   ============================================================ */
const Boot={
  catchupProfile(pid){
    const st=loadProfile(pid);if(!st)return;
    const oldWid=st.windowId;
    const t=nowMs();
    if(t>=st.lastSeen){
      const events=offlineCatchup(st);
      if(windowOf(t)==='morgen'&&/-nacht$/.test(oldWid)&&oldWid!==st.windowId)st.wakePending=true;
      events.forEach(ev=>{
        const prev=S;S=st;
        if(ev.typ==='bericht'){
          const rep=Actions.completeTask(ev.task);
          st.pendingReport=rep;
          if(ev.task.type==='traum'&&windowOf(t)==='morgen')st.wakePending=true;
        }
        if(ev.typ==='gekocht'){ st.pendingCook=Cook.complete(st); }
        if(ev.typ==='beet'){
          for(let i=0;i<ev.n;i++){const z=rnd(DATA2.zutaten.filter(x=>x.tier==='haeufig'));
            st.inventory[z.id]=(st.inventory[z.id]||0)+1;}
        }
        S=prev;
      });
    } else { offlineCatchup(st); }
    save(pid,st);
  },
  enter(pid,fresh){
    this.catchupProfile(pid);
    P=pid;S=loadProfile(pid);
    if(!S){Start.render();return}
    meta.lastActive=pid;saveMeta();
    UI.show('home');
    Creature.mount();
    Fund.mount();
    this.updateSoundBtn();
    UI.refreshHome();
    if(fresh){
      const w=$('#wesen');w.style.transform='scale(0)';w.style.transition='transform 1.1s cubic-bezier(.3,1.4,.5,1)';
      const r=w.getBoundingClientRect();
      setTimeout(()=>{w.style.transform='';UI.sparkleAt(r.left+r.width/2,r.top+r.height/2,ELEMENTS[S.element].farbe);
        Sound.freude();vibr([40,80,40]);},150);
      setTimeout(()=>{w.style.transition='';},1400);
      setTimeout(()=>{
        if(!S.seen.hilfe){S.seen.hilfe=true;saveNow();Help.open('bild');}
      },2600);
      return;
    }
    const proceed=()=>{
      if(S.pendingCook){const pc=S.pendingCook;S.pendingCook=null;saveNow();setTimeout(()=>Cook.announce(pc),1000)}
      if(S.wakePending){UI.status('Pssst. '+S.name+' schläft noch. Tipp es wach.',true);return}
      if(S.pendingReport){const rep=S.pendingReport;setTimeout(()=>Actions.showReport(rep),1400)}
    };
    if(Evo.ready())setTimeout(()=>Evo.run(proceed),900);
    else proceed();
  },
  tick(){
    if(!S||UI.screen==='start'||UI.screen==='ritual')return;
    const t=nowMs();
    if(t>S.lastSeen){applyDecay(S,S.lastSeen,Math.min(t,S.lastSeen+14*36e5));S.lastSeen=t;}
    refreshSchwung(S,t);
    const wid=windowId(t);
    if(wid!==S.windowId){
      const wasNight=/-nacht$/.test(S.windowId);
      S.windowId=wid;
      S.care={fensterId:wid,pet:false,wash:0,geweckt:false};
      if(windowOf(t)==='morgen'&&wasNight)S.wakePending=true;
      S.dailyFind={windowId:wid,taken:false,typ:null,item:null};
      Creature.render();UI.refreshHome();
      UI.toast(windowOf(t)==='morgen'?'Ein neuer Morgen.':windowOf(t)==='mittag'?'Mittagszeit.':windowOf(t)==='abend'?'Der Abend kommt.':'Nacht wird es.',2400);
    }
    if(S.dailyFind.windowId!==wid)S.dailyFind={windowId:wid,taken:false,typ:null,item:null};
    if(S.task&&t>=S.task.end){
      const task=S.task;
      const rep=Actions.completeTask(task);
      if(task.type==='traum'&&windowOf(t)==='morgen'){
        S.pendingReport=rep;S.wakePending=true;
        Creature.render();UI.refreshHome();
        UI.status('Pssst. '+S.name+' träumt noch. Tipp es wach.',true);
      } else {
        Away.arrive();
        setTimeout(()=>Actions.showReport(rep),1150);
      }
    }
    if(S.pot&&t>=S.pot.end){ Cook.announce(Cook.complete(S)); }
    if(hatObjekt(S,'beetkiste')&&t-S.beetStamp>=8*36e5){
      S.beetStamp=t;
      const z=rnd(DATA2.zutaten.filter(x=>x.tier==='haeufig'));
      S.inventory[z.id]=(S.inventory[z.id]||0)+1;
      UI.toast('Die Beetkiste hat was: '+z.emoji+' '+z.name+'.',2800);
      UI.renderDrawer();
    }
    if(S.task)Away.refresh();
    // Sternschnuppen: kleine Glücksmomente zum Antippen
    if(UI.screen==='home'&&!UI.anyOverlay()&&!$('#shootstar').classList.contains('on')&&Math.random()<0.07){
      const ss=$('#shootstar');
      ss.style.left=(15+Math.random()*65)+'%';
      ss.style.top=(14+Math.random()*30)+'%';
      ss.classList.add('on');
      clearTimeout(this._ssT);
      this._ssT=setTimeout(()=>ss.classList.remove('on'),9000);
    }
    if(Evo.ready()&&!UI.anyOverlay()&&!S.task&&!S.wakePending&&UI.screen==='home')Evo.run();
    UI.renderSchwung();
    UI.renderTagesfund();
    Creature.refreshGlow();
    saveNow();
  },
  updateSoundBtn(){
    const on=S&&S.settings.sound;
    $('#soundbtn').innerHTML=on
      ?'<svg viewBox="0 0 24 24" fill="none"><path class="st" d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4Z" stroke-width="2" stroke-linejoin="round"/><path class="st" d="M15.5 9c1.4 1.6 1.4 4.4 0 6M18 6.8c2.5 2.9 2.5 7.5 0 10.4" stroke-width="2" stroke-linecap="round"/></svg>'
      :'<svg viewBox="0 0 24 24" fill="none" opacity=".55"><path class="st" d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4Z" stroke-width="2" stroke-linejoin="round"/><path class="st" d="M15.5 9.8 20 14.2M20 9.8l-4.5 4.4" stroke-width="2" stroke-linecap="round"/></svg>';
  },
  wire(){
    $('#homebtn').onclick=()=>{saveNow();S=null;P=null;Start.render()};
    $('#helpbtn').onclick=()=>Help.open();
    $('#soundbtn').onclick=()=>{S.settings.sound=!S.settings.sound;this.updateSoundBtn();saveNow();
      if(S.settings.sound)Sound.stimme()};
    $('#reportok').onclick=$('#reportclose').onclick=()=>{try{speechSynthesis.cancel()}catch(e){};UI.overlay('ov-report',false)};
    $('#readbtn').onclick=()=>Actions.readAloud();
    $('#sendok').onclick=()=>Actions.confirmSend();
    $('#sendclose').onclick=()=>UI.overlay('ov-send',false);
    $('#gameclose').onclick=()=>{Games.abort();UI.overlay('ov-game',false);UI.refreshHome()};
    $('#battleclose').onclick=()=>Battle.abort();
    $('#helpclose').onclick=()=>{UI.overlay('ov-help',false);
      if(S&&!S.seen.formenkarte)setTimeout(()=>FormMap.open(),700)};
    $('#menuclose').onclick=()=>UI.overlay('ov-menu',false);
    $('#treffenok').onclick=()=>{UI.overlay('ov-treffen',false);Start.render()};
    $('#ritualback').onclick=()=>{UI.overlay('ov-name',false);Start.render()};
    $('#nameclose').onclick=()=>{UI.overlay('ov-name',false);Start.render()};
    $('#nameok').onclick=()=>{
      const n=$('#nameinput').value.trim().slice(0,12);
      if(!n){$('#nameinput').placeholder='Erst ein Name …';return}

    $('#dicebtn').onclick=()=>{$('#nameinput').value=rnd(DATA.traeume.namen)};
    // v2
    $('#cavebtn').onclick=()=>Cave.open();
    $('#caveup').onclick=()=>{UI.show('home');UI.refreshHome()};
    $('#caveshop').onclick=()=>Shop.open();
    $('#formmapbtn').onclick=()=>FormMap.open();
    $('#tagesfund').onclick=()=>Fund.collect();
    $('#shootstar').onclick=e=>{
      const ss=$('#shootstar');ss.classList.remove('on');clearTimeout(this._ssT);
      const n=1+Math.floor(Math.random()*3);
      if(Math.random()<0.18){const z=rnd(DATA2.zutaten.filter(x=>x.tier!=='haeufig'));
        S.inventory[z.id]=(S.inventory[z.id]||0)+1;
        UI.pop(e.clientX,e.clientY,z.emoji);UI.toast('Eine Sternschnuppe! '+z.name+' gefunden.',2600);}
      else{funkelPlus(S,n);UI.pop(e.clientX,e.clientY,'✦');UI.toast('Eine Sternschnuppe! +'+n+' Funkel.',2200);}
      UI.sparkleAt(e.clientX,e.clientY);Sound.freude();vibr([15,30,15]);
      UI.renderDrawer();saveNow();
    };
    $('#cookclose').onclick=()=>UI.overlay('ov-cook',false);
    $('#cookfire').onclick=()=>Cook.fire();
    $('#cookbook').onclick=()=>RecipeBook.open();
    $('#rezepteclose').onclick=()=>UI.overlay('ov-rezepte',false);
    $('#formmapclose').onclick=()=>UI.overlay('ov-formmap',false);
    $('#shopclose').onclick=()=>UI.overlay('ov-shop',false);
    $('#actionrow').addEventListener('click',e=>{
      const b=e.target.closest('.pillbtn');if(!b)return;
      if(b.id==='act-send')Actions.openSend();

      if(b.id==='act-mehr')Menu.open();
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)saveNow();
      else this.catchupVisible();
    });
    window.addEventListener('pagehide',()=>saveNow());
  },
  catchupVisible(){
    if(S&&P){
      save(P,S);
      this.catchupProfile(P);
      S=loadProfile(P);
      Creature.render();UI.refreshHome();
      if(S.pendingCook){const pc=S.pendingCook;S.pendingCook=null;saveNow();Cook.announce(pc)}
      if(S.wakePending)UI.status('Pssst. '+S.name+' schläft. Tipp es wach.',true);
      else if(S.pendingReport){const rep=S.pendingReport;setTimeout(()=>Actions.showReport(rep),800)}
      if(Evo.ready())setTimeout(()=>Evo.run(),600);
    } else if(UI.screen==='start') Start.render();
  },
  start(){
    UI.buildSkyDeco();
    this.wire();
    Gestures.init();
    ['p1','p2'].forEach(p=>{
      const raw=store.get('glimm.'+p);
      if(raw&&raw.v!==2){try{localStorage.removeItem('glimm.'+p)}catch(e){}}
      this.catchupProfile(p);
    });
    if(store.volatile)setTimeout(()=>UI.toast('Hinweis: Hier kann nichts dauerhaft gespeichert werden. Am Handy „Zum Startbildschirm hinzufügen“ nutzen.',5000),1500);
    Start.render();
    setInterval(()=>this.tick(),15000);
    setInterval(()=>Creature.tick(),500);
  },
};

  };
}

/* ---------- PWA: Manifest + Icon zur Laufzeit erzeugen ---------- */
(function pwa(){
  try{
    if(location.protocol!=='https:'&&location.hostname!=='localhost')return;
    const size=512, c=document.createElement('canvas');c.width=c.height=size;
    const x=c.getContext('2d');
    x.fillStyle='#141b33';
    const rr=size*0.22;
    x.beginPath();x.moveTo(rr,0);x.arcTo(size,0,size,size,rr);x.arcTo(size,size,0,size,rr);
    x.arcTo(0,size,0,0,rr);x.arcTo(0,0,size,0,rr);x.fill();
    x.fillStyle='#4a4560';
    x.beginPath();x.ellipse(size/2,size*0.62,size*0.27,size*0.24,0,0,7);x.fill();
    x.beginPath();x.arc(size/2,size*0.38,size*0.21,0,7);x.fill();
    x.beginPath();x.ellipse(size*0.36,size*0.22,size*0.06,size*0.1,-0.3,0,7);x.fill();
    x.beginPath();x.ellipse(size*0.64,size*0.22,size*0.06,size*0.1,0.3,0,7);x.fill();
    const g=x.createRadialGradient(size/2,size*0.62,10,size/2,size*0.62,size*0.2);
    g.addColorStop(0,'#fff6e0');g.addColorStop(0.4,'rgba(255,179,92,.85)');g.addColorStop(1,'rgba(255,179,92,0)');
    x.fillStyle=g;x.beginPath();x.arc(size/2,size*0.62,size*0.2,0,7);x.fill();
    x.fillStyle='#f6efdd';
    x.beginPath();x.ellipse(size*0.43,size*0.38,size*0.035,size*0.045,0,0,7);x.fill();
    x.beginPath();x.ellipse(size*0.57,size*0.38,size*0.035,size*0.045,0,0,7);x.fill();
    x.fillStyle='#2b2836';
    x.beginPath();x.arc(size*0.43,size*0.385,size*0.018,0,7);x.fill();
    x.beginPath();x.arc(size*0.57,size*0.385,size*0.018,0,7);x.fill();
    const icon=c.toDataURL('image/png');
    const man={name:'GLIMM',short_name:'GLIMM',display:'standalone',orientation:'portrait',
      background_color:'#141b33',theme_color:'#141b33',
      start_url:location.href.split('#')[0],
      icons:[{src:icon,sizes:'512x512',type:'image/png'},{src:icon,sizes:'192x192',type:'image/png'}]};
    const link=document.createElement('link');link.rel='manifest';
    link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));
    document.head.appendChild(link);
    const ap=document.createElement('link');ap.rel='apple-touch-icon';ap.href=icon;
    document.head.appendChild(ap);
    if('serviceWorker' in navigator)
      navigator.serviceWorker.register('sw.js').catch(()=>{});
  }catch(e){}
})();
</script>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GLIMM</title>
<style>
/* ============================================================
   GLIMM — ein Wesen, das ein Licht in sich trägt
   Single-File. Keine externen Requests. Kein Build.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,'SF Pro Rounded','Segoe UI',Roboto,'Noto Sans',sans-serif;
  background:#0c1226;color:var(--ink,#2c3038);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  font-size:17px;line-height:1.45;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input{font:inherit}
svg{display:block}

/* ---------- Tageszeit-Paletten ---------- */
#app{
  --sky1:#b9dcea;--sky2:#eef6ee;--hill1:#a5c9ad;--hill2:#83b191;--hill3:#63997c;
  --ground:#8fbf9c;--accent:#5fa89a;--ink:#2c3a3a;--chrome:rgba(255,255,255,.55);
  --card:#fffaf0;--cardink:#33313d;--soft:rgba(30,50,50,.10);
  --starop:0;--sunc:#fff3c9;--heart:#e8756d;
  position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;
  color:var(--ink);
}
#app.t-mittag{--sky1:#5eb1e4;--sky2:#f4eec0;--hill1:#8cc262;--hill2:#68ad4c;--hill3:#4c953e;
  --ground:#74b656;--accent:#e8935a;--ink:#27392c;--chrome:rgba(255,255,255,.6);--sunc:#ffd95e}
#app.t-abend{--sky1:#e0795c;--sky2:#f7cf92;--hill1:#b08370;--hill2:#8f6668;--hill3:#6d4c5c;
  --ground:#9c7466;--accent:#e8875a;--ink:#3d2a30;--chrome:rgba(255,244,224,.5);--sunc:#ff9d47}
#app.t-nacht{--sky1:#0d1b3e;--sky2:#2b4674;--hill1:#22335a;--hill2:#1a2947;--hill3:#121d33;
  --ground:#1b2c4d;--accent:#8fa8d8;--ink:#e6ebf7;--chrome:rgba(20,32,64,.45);
  --soft:rgba(0,0,20,.3);--starop:1;--sunc:#f3edda}

/* ---------- Himmel & Landschaft ---------- */
#sky{position:absolute;inset:0;background:linear-gradient(var(--sky1),var(--sky2) 70%);
  transition:background 2.5s ease}
#skyfade{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 2.2s ease}
#stars{position:absolute;inset:0 0 30% 0;opacity:var(--starop);transition:opacity 2.5s ease;pointer-events:none}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#f5f2e2;
  animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.25}}
#orb{position:absolute;width:74px;height:74px;border-radius:50%;background:var(--sunc);
  filter:blur(1px);box-shadow:0 0 46px 18px var(--sunc);opacity:.9;
  transition:all 2.5s ease;pointer-events:none}
#hills{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none}
#hills svg{width:100%;height:100%}
.hillA{fill:var(--hill1)}.hillB{fill:var(--hill2)}.hillC{fill:var(--hill3)}
.hillA,.hillB,.hillC{transition:fill 2.5s ease}
#fireflies{position:absolute;inset:30% 0 20% 0;pointer-events:none;opacity:var(--starop);transition:opacity 2s}
.ffly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a0;
  box-shadow:0 0 8px 3px rgba(255,233,160,.6);animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0);opacity:.2}30%{opacity:.95}60%{opacity:.3}100%{transform:translate(46px,-34px);opacity:.85}}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.overlay{position:absolute;inset:0;display:none;z-index:40;flex-direction:column;
  align-items:center;justify-content:center;padding:22px;
  background:rgba(14,18,34,.55);backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.card{background:var(--card);color:var(--cardink);border-radius:24px;
  padding:22px 20px;max-width:420px;width:100%;box-shadow:0 14px 44px rgba(10,14,30,.35);
  max-height:86vh;max-height:86dvh;overflow-y:auto;overscroll-behavior:contain}
.card h2{font-size:1.25em;font-weight:800;letter-spacing:.01em;margin-bottom:10px}
.bigbtn{display:block;width:100%;min-height:60px;border-radius:18px;
  background:var(--accent);color:#fff;font-weight:700;font-size:1.05em;
  box-shadow:0 4px 0 rgba(0,0,0,.15);margin-top:12px;padding:12px 16px}
.bigbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.bigbtn.ghost{background:transparent;color:var(--cardink);box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
.bigbtn.ghost:active{transform:translateY(1px)}

/* ---------- Top-Chrome ---------- */
#chrome{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;
  justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.chip{width:52px;height:52px;border-radius:50%;background:var(--chrome);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
  box-shadow:0 2px 10px var(--soft);transition:background 2s ease}
.chip:active{transform:scale(.92)}
.chip svg{width:26px;height:26px}
.chip .st{stroke:var(--ink);transition:stroke 2s ease}
#hearts{display:flex;gap:8px;background:var(--chrome);border-radius:999px;
  padding:9px 14px;backdrop-filter:blur(6px);box-shadow:0 2px 10px var(--soft);transition:background 2s ease}
.hbeat{width:24px;height:24px;transition:transform .3s}
.hbeat path{fill:var(--heart);transition:fill .5s,opacity .5s}
.hbeat.off path{fill:none;stroke:var(--ink);stroke-width:2;opacity:.45}
.hbeat.spend{animation:hspend .55s ease}
@keyframes hspend{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}

/* ---------- Statuszeile ---------- */
#statusline{position:absolute;left:0;right:0;top:calc(72px + env(safe-area-inset-top));
  text-align:center;z-index:25;pointer-events:none;padding:0 24px}
#statusline span{display:inline-block;background:var(--chrome);border-radius:999px;
  padding:7px 16px;font-size:.92em;backdrop-filter:blur(6px);color:var(--ink);
  box-shadow:0 2px 10px var(--soft);transition:background 2s ease,color 2s ease;
  opacity:0;transform:translateY(-6px);transition:opacity .6s,transform .6s}
#statusline span.on{opacity:1;transform:none}

/* ---------- Wesen-Bühne ---------- */
#stage{position:absolute;inset:0;z-index:10}
#wesen{position:absolute;left:50%;top:56%;width:min(64vw,300px);aspect-ratio:1;
  transform:translate(-50%,-50%);touch-action:none;cursor:pointer;
  transition:filter 1.5s ease}
#wesen.away{display:none}
#wesen svg{width:100%;height:100%;overflow:visible}
.w-shadow{fill:rgba(10,14,30,.18);transition:all 2s}
.t-abend .w-shadow{transform:scaleX(1.9) translateX(-14px);opacity:.75}
.t-nacht .w-shadow{opacity:.4}
#wesen .breath{animation:breathe 3.2s ease-in-out infinite;transform-origin:100px 132px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.028,1.045)}}
#wesen.sleeping .breath{animation-duration:5s}
#wesen .headg{transition:transform .25s ease-out;transform-origin:100px 108px}
#wesen .eyes-w{transform-origin:center;transition:transform .12s}
#wesen.blink .eyes-w{transform:scaleY(.08)}
#wesen.sleeping .eyes-w{transform:scaleY(.08)}
#wesen .pupils{transition:transform .3s}
#wesen.happy-hop{animation:hop .5s ease}
@keyframes hop{0%,100%{transform:translate(-50%,-50%)}35%{transform:translate(-50%,-58%) scale(1.04,.97)}65%{transform:translate(-50%,-49%) scale(.98,1.03)}}
#wesen.nuzzle svg{animation:nuzzle .9s ease}
@keyframes nuzzle{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}70%{transform:rotate(4deg)}}
#wesen.sad .earL{transform:rotate(-14deg)}#wesen.sad .earR{transform:rotate(14deg)}
.earL,.earR{transition:transform .8s;transform-origin:100px 70px}

/* Glimmen — die Statusanzeige */
.glim{transform-origin:100px 128px}
.glim-hell{animation:gHell 3.6s ease-in-out infinite}
@keyframes gHell{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.07)}}
.glim-ruhig{animation:gRuhig 4.2s ease-in-out infinite}
@keyframes gRuhig{0%,100%{opacity:.8}50%{opacity:.62}}
.glim-flackern{animation:gFlack 1.15s linear infinite}
@keyframes gFlack{0%{opacity:.85}12%{opacity:.3}24%{opacity:.75}35%{opacity:.42}55%{opacity:.88}68%{opacity:.25}82%{opacity:.7}100%{opacity:.85}}
.glim-langsam{animation:gLang 6.5s ease-in-out infinite}
@keyframes gLang{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:.2;transform:scale(.88)}}
.glim-trueb{animation:gTrueb 5s ease-in-out infinite;filter:saturate(.25)}
@keyframes gTrueb{0%,100%{opacity:.35}50%{opacity:.25}}
.dirt{opacity:0;transition:opacity 1.2s}
#wesen.dirty .dirt{opacity:.85}

/* Herzchen / Partikel */
.pop{position:absolute;z-index:35;pointer-events:none;font-size:22px;
  animation:popup 1.1s ease forwards}
@keyframes popup{0%{opacity:0;transform:translateY(6px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-52px) scale(1.15)}}
.sparkle{position:absolute;z-index:35;pointer-events:none;width:8px;height:8px;border-radius:50%;
  animation:sprk .8s ease forwards}
@keyframes sprk{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6) translateY(-26px)}}

/* ---------- Futterleiste ---------- */
#drawer{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:30;background:var(--chrome);backdrop-filter:blur(8px);
  border-radius:26px;padding:10px 12px;display:flex;gap:6px;max-width:92%;
  overflow-x:auto;box-shadow:0 4px 16px var(--soft);transition:background 2s ease;
  scrollbar-width:none}
#drawer::-webkit-scrollbar{display:none}
.fooditem{min-width:58px;height:72px;border-radius:18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:30px;touch-action:pan-x;
  position:relative;background:rgba(255,255,255,.35)}
.t-nacht .fooditem{background:rgba(255,255,255,.08)}
.fooditem small{font-size:10px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--ink);opacity:.85}
.fooditem .cnt{position:absolute;top:2px;right:4px;font-size:11px;font-weight:800;color:var(--ink);opacity:.7}
.fooditem.dragging{opacity:.25}
#dragGhost{position:absolute;z-index:60;pointer-events:none;font-size:38px;display:none;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
#actionrow{position:absolute;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:10px;z-index:29;padding:0 16px;flex-wrap:wrap;pointer-events:none}
#actionrow .pillbtn{pointer-events:auto}
.pillbtn{background:var(--chrome);backdrop-filter:blur(6px);border-radius:999px;
  min-height:52px;padding:10px 18px;font-weight:700;color:var(--ink);
  box-shadow:0 2px 10px var(--soft);display:flex;align-items:center;gap:8px;font-size:.98em;
  transition:background 2s ease,color 2s ease}
.pillbtn:active{transform:scale(.95)}
.pillbtn .em{font-size:20px}

/* ---------- Startbildschirm ---------- */
#scr-start{z-index:20;align-items:center;justify-content:center;gap:18px;padding:24px}
#scr-start h1{font-size:2.1em;font-weight:800;letter-spacing:.14em;color:var(--ink);
  text-shadow:0 2px 14px rgba(255,255,255,.2)}
#profilecards{display:flex;gap:16px;width:100%;max-width:440px;justify-content:center}
.pcard{flex:1;max-width:210px;background:var(--card);border-radius:26px;padding:16px 12px 14px;
  display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--cardink);
  box-shadow:0 10px 30px rgba(10,14,30,.3);min-height:230px;justify-content:center}
.pcard:active{transform:scale(.97)}
.pcard .mini{width:120px;height:120px}
.pcard .pname{font-weight:800;font-size:1.15em}
.pcard .pstat{font-size:.82em;opacity:.7;text-align:center;min-height:2.2em}
.pcard.empty .pname{opacity:.55;font-weight:600;font-size:.95em}
#startextra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
#startextra .pillbtn{font-size:.9em}

/* ---------- Ritual ---------- */
#scr-ritual{z-index:22;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,#1b2547,#0b1020 75%)}
#ritualhint{position:absolute;bottom:14%;left:0;right:0;text-align:center;color:#cfd8f2;
  font-size:1.05em;opacity:.85;padding:0 30px;transition:opacity .8s}
#knospe{width:200px;height:220px;cursor:pointer;touch-action:none}
#knospe.shake{animation:kshake .5s ease}
@keyframes kshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scale(1.02)}75%{transform:rotate(3deg)}}
#sparks{position:absolute;inset:0;pointer-events:none}
.spark{position:absolute;width:64px;height:64px;border-radius:50%;cursor:pointer;
  pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
  animation:sfloat 4s ease-in-out infinite alternate}
.spark::before{content:'';width:26px;height:26px;border-radius:50%;background:var(--sc);
  box-shadow:0 0 22px 10px var(--sg)}
@keyframes sfloat{from{transform:translateY(0)}to{transform:translateY(-16px)}}
#namecard{max-width:340px}
#nameinput{width:100%;font-size:1.3em;padding:12px 14px;border-radius:14px;border:2px solid #d8d2c4;
  background:#fffdf6;text-align:center;font-weight:700;color:#33313d}
#nameinput:focus{outline:none;border-color:var(--accent,#5fa89a)}
.namerow{display:flex;gap:10px;margin-top:12px}
.namerow .bigbtn{margin-top:0}
#dicebtn{flex:0 0 64px;font-size:26px;background:#efe9da;color:#33313d}

/* ---------- Unterwegs-Szene ---------- */
#awayscene{position:absolute;inset:0;z-index:12;display:none}
#awayscene.on{display:block}
#awaypath{position:absolute;left:8%;right:8%;top:52%;height:80px}
#awaywalker{position:absolute;width:92px;height:92px;transition:left 1.2s linear;cursor:pointer}
#awaywalker svg{width:100%;height:100%}
#awaywalker .walkbob{animation:walkbob 1.6s ease-in-out infinite}
@keyframes walkbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
#awayinfo{position:absolute;left:0;right:0;top:63%;text-align:center;color:var(--ink);pointer-events:none}
#awayinfo .big{font-weight:800;font-size:1.1em}
#awayinfo .sub{opacity:.75;font-size:.9em;margin-top:4px}

/* ---------- Bericht ---------- */
#reportcard .icons{font-size:34px;letter-spacing:8px;text-align:center;margin:8px 0 12px}
#reportcard .rtext{font-size:1.08em;line-height:1.6;font-family:Georgia,'Times New Roman',serif}
#reportcard .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip2{background:#efe9da;border-radius:999px;padding:6px 12px;font-size:.85em;font-weight:700}
#readbtn{margin-top:10px}

/* ---------- Senden ---------- */
.focusgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.focusbtn{border-radius:18px;background:#f2ecdd;padding:14px 8px;display:flex;flex-direction:column;
  align-items:center;gap:4px;min-height:84px;font-weight:700;font-size:.92em}
.focusbtn .em{font-size:32px}
.focusbtn.sel{background:var(--accent);color:#fff}
.taskrow{display:flex;gap:8px;margin-top:12px}
.taskbtn{flex:1;border-radius:16px;background:#f2ecdd;padding:10px 6px;text-align:center;
  font-size:.85em;font-weight:700;min-height:66px}
.taskbtn .em{font-size:22px;display:block}
.taskbtn.sel{background:var(--accent);color:#fff}
.taskbtn small{display:block;font-weight:600;opacity:.7;font-size:.85em}

/* ---------- Kampf ---------- */
#battlefield{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 4px;min-height:130px}
.fighter{width:120px;text-align:center}
.fighter .fsvg{width:110px;height:110px;margin:0 auto}
.fighter .femoji{font-size:64px;line-height:110px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.fighter.hit{animation:fhit .4s ease}
@keyframes fhit{0%,100%{transform:translateX(0)}30%{transform:translateX(-8px) rotate(-4deg)}60%{transform:translateX(5px)}}
.fighter.attack{animation:fatk .45s ease}
@keyframes fatk{0%,100%{transform:translateX(0)}40%{transform:translateX(26px) scale(1.06)}}
.fighter.enemy.attack{animation:fatkE .45s ease}
@keyframes fatkE{0%,100%{transform:translateX(0)}40%{transform:translateX(-26px) scale(1.06)}}
.hpbar{height:12px;border-radius:8px;background:#e3dccb;overflow:hidden;margin-top:6px}
.hpfill{height:100%;border-radius:8px;background:linear-gradient(90deg,#7cc96f,#a8dd8c);transition:width .5s ease}
.hpfill.low{background:linear-gradient(90deg,#e8a25a,#e8c25a)}
.fname{font-size:.85em;font-weight:800;margin-top:4px}
.elem{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:-4px;margin-left:4px;
  box-shadow:0 0 8px 2px var(--eg)}
#timingwrap{margin-top:10px;position:relative;height:64px;border-radius:16px;background:#efe9da;
  overflow:hidden;touch-action:manipulation}
#timingzone{position:absolute;top:0;bottom:0;background:rgba(124,201,111,.55);border-radius:8px}
#timingzone.gold{background:rgba(232,185,73,.65)}
#timingcursor{position:absolute;top:4px;bottom:4px;width:7px;border-radius:4px;background:#33313d}
#timinghint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;opacity:.5;font-size:.95em;pointer-events:none}
#battlemsg{text-align:center;min-height:2.6em;font-size:.95em;margin-top:8px;font-weight:600}

/* ---------- Minispiele ---------- */
#gamearea{position:relative;width:100%;height:min(62vh,520px);border-radius:20px;overflow:hidden;
  background:linear-gradient(var(--sky1),var(--sky2));touch-action:none}
.falling{position:absolute;font-size:36px;pointer-events:none;will-change:transform}
#gcatcher{position:absolute;bottom:6px;width:86px;height:86px;pointer-events:none;will-change:left}
#gcatcher svg{width:100%;height:100%}
.simonwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:26px;height:100%;align-content:center}
.simonstone{border-radius:26px;aspect-ratio:1.25;display:flex;align-items:center;justify-content:center;
  font-size:44px;background:var(--stc);opacity:.55;transition:opacity .18s,transform .18s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.simonstone.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 26px 6px var(--stg),inset 0 -6px 0 rgba(0,0,0,.12)}
#rhywrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:26px}
#rhydrum{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6e0,#e8c98a);
  box-shadow:0 8px 0 #c9a76a,0 12px 24px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:56px}
#rhydrum.beat{animation:drumbeat .22s ease}
@keyframes drumbeat{0%,100%{transform:scale(1)}40%{transform:scale(.9)}}
#gamehud{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:700}
#gameresult{text-align:center}
#gameresult .rscore{font-size:2.4em;font-weight:800;margin:6px 0}
#gameresult .rbest{font-size:.9em;opacity:.7}

/* ---------- Evolution ---------- */
#ov-report{z-index:46}
#ov-evo{background:rgba(6,8,18,.92);z-index:47}
#evotext{color:#e8ecf6;font-size:1.25em;line-height:1.75;max-width:360px;text-align:center;
  font-family:Georgia,serif;min-height:7em}
#evostage{width:min(70vw,320px);aspect-ratio:1;position:relative}
#evostage .eold,#evostage .enew{position:absolute;inset:0;transition:opacity 2.2s ease,filter 2.2s ease}
#evostage .enew{opacity:0}
#evostage.morph .eold{opacity:0;filter:blur(8px) brightness(3)}
#evostage.morph .enew{opacity:1}
#evoflash{position:absolute;inset:0;background:radial-gradient(circle,#fff8e0,transparent 70%);
  opacity:0;pointer-events:none;transition:opacity 1.6s}
#evostage.morph #evoflash{animation:eflash 2.4s ease}
@keyframes eflash{0%{opacity:0}45%{opacity:.95}100%{opacity:0}}
#evocompare{display:flex;gap:16px;align-items:center;justify-content:center}
#evocompare .half{text-align:center}
#evocompare .half svg{width:120px;height:120px}
#evocompare .arrow{font-size:30px;color:#e8ecf6}

/* ---------- Hilfe ---------- */
#helptabs{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.htab{width:64px;height:56px;border-radius:16px;background:#efe9da;display:flex;
  align-items:center;justify-content:center}
.htab svg{width:34px;height:34px}
.htab.sel{background:var(--accent)}
.helpcard{background:#f7f2e6;border-radius:18px;padding:16px;margin-bottom:12px;text-align:center}
.helpcard .demo{height:130px;position:relative;margin-bottom:8px}
.helpcard .demo svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:110px;height:110px}
.helpcard h3{font-size:1.15em;font-weight:800;margin-bottom:4px}
.helpcard p{font-size:1.02em}
.hand{position:absolute;font-size:40px;z-index:5;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.hand.stroke{animation:handstroke 2s ease-in-out infinite}
@keyframes handstroke{0%,100%{transform:translate(-46px,-6px) rotate(-10deg)}50%{transform:translate(30px,-16px) rotate(8deg)}}
.hand.circle{animation:handcircle 2.4s linear infinite}
@keyframes handcircle{0%{transform:translate(-30px,-10px)}25%{transform:translate(0,-34px)}50%{transform:translate(30px,-10px)}75%{transform:translate(0,14px)}100%{transform:translate(-30px,-10px)}}
.hand.lift{animation:handlift 2.2s ease-in-out infinite}
@keyframes handlift{0%,20%{transform:translate(0,44px)}55%,70%{transform:translate(0,-30px)}100%{transform:translate(0,44px)}}
.hand.pull{animation:handpull 2.4s ease-in-out infinite}
@keyframes handpull{0%,15%{transform:translate(-20px,0)}60%,75%{transform:translate(58px,0)}100%{transform:translate(-20px,0)}}
.glowrow{display:flex;justify-content:space-between;gap:4px;margin-top:6px}
.glowrow .gr{flex:1;text-align:center;font-size:.72em;font-weight:700}
.glowrow .gr svg{width:100%;max-width:58px;height:58px;margin:0 auto}
details.hsec{background:#f7f2e6;border-radius:14px;margin-bottom:8px;padding:2px 0}
details.hsec summary{padding:13px 16px;font-weight:800;cursor:pointer;list-style:none;min-height:52px;display:flex;align-items:center}
details.hsec summary::before{content:'▸';margin-right:8px;transition:transform .2s;display:inline-block}
details.hsec[open] summary::before{transform:rotate(90deg)}
details.hsec .htxt{padding:0 16px 14px;font-size:.95em;line-height:1.55}

/* ---------- Code / Statistik ---------- */
#codeshow{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.25em;letter-spacing:2px;
  background:#efe9da;padding:12px;border-radius:12px;text-align:center;user-select:all;-webkit-user-select:all;margin:8px 0;overflow-wrap:anywhere}
#codein{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:1.1em;padding:12px;
  border-radius:12px;border:2px solid #d8d2c4;text-align:center;text-transform:uppercase;background:#fffdf6;color:#33313d}
.statrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.statrow .sname{flex:0 0 92px;font-weight:700;font-size:.9em}
.statrow .sbar{flex:1;height:14px;border-radius:8px;background:#e8e2d2;overflow:hidden}
.statrow .sfill{height:100%;border-radius:8px;background:var(--accent)}
.statrow .sval{flex:0 0 34px;text-align:right;font-weight:800;font-size:.9em}
.needicons{display:flex;justify-content:space-around;margin:6px 0 2px}
.needicons .ni{text-align:center;font-size:24px}
.needicons .ni small{display:block;font-size:11px;font-weight:700;opacity:.7}

/* ---------- Chronik ---------- */
.chronentry{background:#f7f2e6;border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:.95em}
.chronentry .cd{font-size:.8em;opacity:.6;font-weight:700}

/* ---------- Toast & Sonstiges ---------- */
#toast{position:absolute;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:var(--card);color:var(--cardink);padding:12px 20px;border-radius:16px;z-index:70;
  opacity:0;transition:all .45s ease;pointer-events:none;font-weight:600;box-shadow:0 8px 24px rgba(10,14,30,.3);
  max-width:86%;text-align:center;font-size:.95em}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.closex{position:sticky;top:0;float:right;width:44px;height:44px;border-radius:50%;
  background:#efe9da;font-size:20px;font-weight:800;z-index:5;margin-left:8px}
.hidden{display:none !important}
#treffenstage{position:relative;height:240px}
#treffenstage .tw{position:absolute;top:30px;width:150px;height:150px;transition:left 2.2s ease,right 2.2s ease}
@media (prefers-reduced-motion:reduce){
  .hand,.ffly,.star{animation-duration:8s !important}
  #wesen.happy-hop,.fighter.attack,.fighter.hit{animation:none !important}
}

/* ---------- Zauberkessel ---------- */
#kesselwrap{display:flex;flex-direction:column;align-items:center;gap:14px}
#kessel{width:220px;height:200px;cursor:pointer;touch-action:none}
#kessel svg{width:100%;height:100%;overflow:visible}
#kessel.wobble{animation:kwobble .5s ease}
@keyframes kwobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-3deg) scale(1.02)}75%{transform:rotate(2deg)}}
#kesselslots{display:flex;gap:10px;min-height:56px}
#kesselslots .potslot{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#8f9ac2}
#kesselslots .potslot.filled{background:rgba(255,255,255,.16);border-style:solid}
#kesselzutaten{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));
  display:none;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
#kesselzutaten.on{display:flex}
#kesselzutaten::-webkit-scrollbar{display:none}
#kesselzutaten .fooditem{background:rgba(255,255,255,.1)}
#kesselzutaten .fooditem small{color:#cfd8f2}
#kesselzutaten .fooditem.used{opacity:.3;pointer-events:none}
.kbubble{position:absolute;border-radius:50%;pointer-events:none;animation:kbub 1.6s ease-out forwards}
@keyframes kbub{0%{opacity:.9;transform:translateY(0) scale(.5)}100%{opacity:0;transform:translateY(-60px) scale(1.3)}}
/* ---------- Sternschnuppe ---------- */
#shootstar{position:absolute;z-index:26;width:56px;height:56px;display:none;cursor:pointer;touch-action:manipulation}
#shootstar.on{display:block;animation:ssfloat 2.8s ease-in-out infinite alternate}
@keyframes ssfloat{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
#shootstar .core{width:22px;height:22px;margin:17px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff8dc,#ffd95e);
  box-shadow:0 0 18px 8px rgba(255,217,94,.75);animation:twinkle 1.4s ease-in-out infinite}
/* ---------- v2: Schwung & Funkel ---------- */
#schwungwrap{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--chrome);
  border-radius:16px;padding:8px 14px;backdrop-filter:blur(6px);box-shadow:0 2px 10px var(--soft);transition:background 2s ease}
#schwungbar{display:flex;gap:3px}
.sw-seg{width:13px;height:14px;border-radius:5px;background:rgba(120,120,140,.25);transition:background .4s}
.sw-seg.full{background:linear-gradient(180deg,#ffe9a0,#f4b95a);box-shadow:0 0 6px rgba(244,185,90,.55)}
.sw-seg.drain{animation:swdrain .5s ease}
@keyframes swdrain{0%{transform:scale(1.4)}100%{transform:scale(1)}}
#schwungnum{font-size:11px;font-weight:800;color:var(--ink);opacity:.7;min-height:12px;line-height:1}
#funkelpill{position:absolute;top:calc(74px + env(safe-area-inset-top));right:12px;z-index:28;
  background:var(--chrome);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9em;
  color:var(--ink);backdrop-filter:blur(6px);box-shadow:0 2px 10px var(--soft);display:flex;align-items:center;gap:5px}
#funkelpill .fk{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff8dc,#f4c95a);
  box-shadow:0 0 8px 2px rgba(244,201,90,.7);animation:twinkle 2.6s ease-in-out infinite}
/* ---------- v2: Seitenknöpfe ---------- */
#sidechips{position:absolute;left:12px;bottom:calc(112px + env(safe-area-inset-bottom));z-index:30;
  display:flex;flex-direction:column;gap:10px}
/* ---------- v2: Tagesfund ---------- */
#tagesfund{position:absolute;right:14%;bottom:calc(180px + env(safe-area-inset-bottom));z-index:24;
  width:64px;height:64px;display:none;cursor:pointer;touch-action:manipulation}
#tagesfund.on{display:block;animation:tfglow 2.4s ease-in-out infinite}
@keyframes tfglow{0%,100%{filter:drop-shadow(0 0 6px rgba(255,233,160,.7))}50%{filter:drop-shadow(0 0 16px rgba(255,233,160,1))}}
#tagesfund svg{width:100%;height:100%}
/* ---------- v2: Höhle ---------- */
#scr-cave{z-index:18}
#cavebg{position:absolute;inset:0;transition:background 1.5s ease}
#cavefloor{position:absolute;left:0;right:0;bottom:0;height:30%;border-radius:50% 50% 0 0 / 26% 26% 0 0;transition:background 1.5s}
#caveitems{position:absolute;inset:0}
.caveobj{position:absolute;font-size:44px;transform:translate(-50%,-50%);touch-action:none;cursor:grab;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));user-select:none;transition:font-size .3s}
.caveobj.dragging{font-size:52px;z-index:10}
#cavetrash{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:60px;height:60px;
  border-radius:50%;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;
  font-size:26px;opacity:.55;z-index:9}
#cavetrash.hot{opacity:1;background:rgba(200,90,80,.5)}
#cavename{position:absolute;left:0;right:0;top:calc(76px + env(safe-area-inset-top));text-align:center;
  color:#e8ecf7;font-weight:800;letter-spacing:.06em;opacity:.8;pointer-events:none}
#cavehint{position:absolute;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom));text-align:center;
  color:#cfd6ea;font-size:.85em;opacity:.7;pointer-events:none;padding:0 30px}
.cavechip{position:absolute;z-index:12}
/* ---------- v2: Kochen ---------- */
#potzone{display:flex;justify-content:center;align-items:flex-end;gap:8px;min-height:110px;margin:6px 0}
#potslots{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.potslot{width:58px;height:58px;border-radius:16px;background:#efe9da;border:2px dashed #cfc5ae;
  display:flex;align-items:center;justify-content:center;font-size:30px}
.potslot.filled{border-style:solid;background:#fff7e6}
#potfig{font-size:64px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
#potfig.cooking{animation:potshake 1.6s ease-in-out infinite}
@keyframes potshake{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}70%{transform:rotate(2deg)}}
#potsteam{text-align:center;min-height:1.5em;font-size:.95em;font-weight:600}
#cookzutaten{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
#cookzutaten::-webkit-scrollbar{display:none}
/* ---------- v2: Rezeptbuch ---------- */
.rezeptrow{display:flex;align-items:center;gap:10px;background:#f7f2e6;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.rezeptrow .rem{font-size:30px;flex:0 0 40px;text-align:center}
.rezeptrow .rname{font-weight:800}
.rezeptrow .rsub{font-size:.82em;opacity:.7}
.rezeptrow.unknown{opacity:.6}
.rezeptrow.unknown .rem{filter:grayscale(1);opacity:.5}
/* ---------- v2: Formenkarte ---------- */
#formtree{display:flex;flex-direction:column-reverse;gap:14px;padding:6px 0}
.formrow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.formcell{width:72px;text-align:center}
.formcell .fsil{width:64px;height:64px;margin:0 auto}
.formcell.locked .fsil svg{filter:brightness(0) opacity(.45)}
.formcell.reached .fsil{animation:formglow 3s ease-in-out infinite}
@keyframes formglow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,233,160,.5))}50%{filter:drop-shadow(0 0 12px rgba(255,233,160,.9))}}
.formcell .fname{font-size:.68em;font-weight:800;margin-top:2px}
.formcell .fhint{font-size:.62em;opacity:.65;line-height:1.25;margin-top:2px}
/* ---------- v2: Shop ---------- */
.shoprow{display:flex;align-items:center;gap:10px;background:#f7f2e6;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.shoprow .sem{font-size:28px;flex:0 0 38px;text-align:center}
.shoprow .sinfo{flex:1}
.shoprow .sname{font-weight:800}
.shoprow .ssub{font-size:.8em;opacity:.7}
.shopbuy{background:var(--accent);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;min-height:44px;white-space:nowrap}
.shopbuy:disabled{opacity:.4}
.shopbuy.owned{background:#cfc5ae}
.drawerempty{font-size:.85em;font-weight:600;color:var(--ink);opacity:.75;padding:14px 10px;max-width:230px}
.fooditem.dish{background:rgba(255,236,180,.55)}
.t-nacht .fooditem.dish{background:rgba(255,236,180,.18)}
</style>
</head>
<body>
<div id="app" class="t-morgen">
  <div id="sky"></div><div id="skyfade"></div>
  <div id="stars"></div>
  <div id="orb"></div>

      <path class="hillA" d="M0,80 Q70,30 150,68 T400,55 V200 H0 Z"/>
      <path class="hillB" d="M0,120 Q110,70 210,108 T400,100 V200 H0 Z"/>
      <path class="hillC" d="M0,165 Q130,125 260,155 T400,150 V200 H0 Z"/>
    </svg>
  </div>
  <div id="fireflies"></div>

  <!-- ======= Startbildschirm ======= -->

  <!-- ======= Hauptbildschirm ======= -->

    <div id="cavefloor"></div>
    <div id="cavename"></div>
    <div id="caveitems"></div>
    <div id="cavetrash">🕳️</div>

      <svg viewBox="0 0 24 24" fill="none"><path d="M6 14l6-6 6 6" stroke="#e8ecf7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="chip cavechip" id="caveshop" style="right:12px;top:calc(10px + env(safe-area-inset-top))" aria-label="Sachen holen">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#e8ecf7" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- Chrome (nur im Home sichtbar) -->
  <div id="chrome" class="hidden">
    <button class="chip" id="homebtn" aria-label="Zurück zum Start">
      <svg viewBox="0 0 24 24" fill="none"><path class="st" d="M3 11.5 12 4l9 7.5M5.5 10v9h13v-9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>

    <div id="schwungwrap"><div id="schwungbar"></div><div id="schwungnum"></div></div>
    <div style="display:flex;gap:8px">

        <svg viewBox="0 0 24 24" fill="none"><path class="st" d="M9 9.2a3 3 0 1 1 4.2 2.9c-.9.5-1.2 1-1.2 2.1" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.5" fill="currentColor" class="stf"/></svg>
      </button>

  <div id="dragGhost"></div>

  </div></div>

  <div id="ov-menu" class="overlay"><div class="card">
    <button class="closex" id="menuclose">✕</button>
    <h2 id="menutitle"></h2>
    <div id="menubody"></div>
  </div></div>

  <div id="ov-cook" class="overlay"><div class="card">

    <h2 id="cooktitle">Kochen</h2>

    <div id="potsteam"></div>

  <div id="ov-formmap" class="overlay"><div class="card">
    <button class="closex" id="formmapclose">✕</button>

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- Zeit ---------- */
const nowMs=()=>Date.now()+DEBUG.offset;
function windowOf(t){
  const h=new Date(t).getHours();
  if(h>=6&&h<11)return 'morgen';
  if(h>=11&&h<17)return 'mittag';
  if(h>=17&&h<22)return 'abend';
  return 'nacht';
}
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function windowId(t){
  const d=new Date(t), w=windowOf(t);
  if(w==='nacht'&&d.getHours()<6){const p=new Date(t-864e5);return dstr(p)+'-nacht'}
  return dstr(d)+'-'+w;
}
function windowEndMs(t){
  const h=new Date(t).getHours(), e=new Date(t);
  e.setMinutes(0,0,0);
  if(h>=6&&h<11)e.setHours(11); else if(h>=11&&h<17)e.setHours(17);
  else if(h>=17&&h<22)e.setHours(22);
  else if(h>=22){e.setDate(e.getDate()+1);e.setHours(6)} else e.setHours(6);
  return e.getTime();
}
function nextMorningMs(t){
  const e=new Date(t); e.setMinutes(0,0,0); e.setHours(6);
  if(e.getTime()<=t)e.setDate(e.getDate()+1);
  return e.getTime();
}
const fmtTime=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};

    get(k){try{if(ok){const v=localStorage.getItem(k);return v?JSON.parse(v):null}}catch(e){}return mem[k]?JSON.parse(mem[k]):null},
    set(k,v){const s=JSON.stringify(v);mem[k]=s;if(ok)try{localStorage.setItem(k,s)}catch(e){}},
    volatile:!ok
  };
})();

function normalizeState(raw){
  if(!raw||typeof raw!=='object'||typeof raw.name!=='string'||!raw.name||!ELEMENTS[raw.element])return null;
  if(raw.v!==2)return null; // neues Spiel, neues Glück: alte Stände zählen nicht mehr
  const d=newState(raw.name,raw.element);
  const out=Object.assign({},d,raw);
  ['needs','stats','counters','care','seen','settings','inventory','dishes','highs','buffs','dailyFind'].forEach(k=>{
    out[k]=Object.assign({},d[k],(raw[k]&&typeof raw[k]==='object')?raw[k]:{});
  });
  ['log','chronicle','seenRare','recipes','formsSeen'].forEach(k=>{if(!Array.isArray(out[k]))out[k]=d[k]});
  out.cave=(raw.cave&&typeof raw.cave==='object'&&Array.isArray(raw.cave.items))?raw.cave:d.cave;
  Object.keys(d.needs).forEach(k=>{const v=Number(out.needs[k]);out.needs[k]=isFinite(v)?clamp(v,10,100):d.needs[k]});
  Object.keys(d.stats).forEach(k=>{const v=Number(out.stats[k]);out.stats[k]=isFinite(v)?v:d.stats[k]});
  if(out.task&&(typeof out.task!=='object'||!isFinite(out.task.end)))out.task=null;
  if(out.pot&&(typeof out.pot!=='object'||!isFinite(out.pot.end)))out.pot=null;
  if(!isFinite(out.lastSeen))out.lastSeen=nowMs();
  if(!isFinite(out.schwung))out.schwung=SCHWUNG_MAX;
  if(!isFinite(out.schwungStamp))out.schwungStamp=nowMs();
  if(!isFinite(out.funkel))out.funkel=0;
  if(![1,2,3,4].includes(out.stage))out.stage=1;
  return out;
}

/* ---------- Höhlen-/Objekt-Wirkungen ---------- */
const hatObjekt=(st,id)=>st.cave.items.some(o=>o.id===id);
function caveMods(st){
  return {
    launeMul:(hatObjekt(st,'laterne')?0.8:1)*(st.cave.id==='moosgrotte'?0.8:1),
    sauberMul:hatObjekt(st,'wasserschale')?0.8:1,
    nachtRegenPlus:hatObjekt(st,'nest')?3:0,
    kochMul:st.cave.id==='wurzelhoehle'?0.8:1,
    klugMul:st.cave.id==='kristallkammer'?1.15:1,
    traumMul:(st.cave.id==='sternenspalte'?1.25:1)*(hatObjekt(st,'traumfaenger')?1.2:1),
    trainMul:hatObjekt(st,'trainingsstein')?1.1:1,
    tempoMul:hatObjekt(st,'kletterast')?1.1:1,
  };
}

/* ---------- Bedürfnisverfall ---------- */
function applyDecay(st,fromMs,toMs){
  let dt=(toMs-fromMs)/36e5;
  if(dt<=0)return;
  dt=Math.min(dt,14); // Verfallsdeckel
  const n=st.needs,mods=caveMods(st);
  let t=fromMs; const step=36e5/4; let rest=dt*36e5;
  while(rest>0){
    const d0=Math.min(step,rest)/36e5;
    const w=windowOf(t);
    const activeTask=st.task&&t<st.task.end;
    const taskMul=activeTask&&st.task.type!=='traum'?1.5:1;
    const schutz=t<st.buffs.schutzUntil?0.5:1; // Schutzgericht: Verfall halbiert
    const d=d0*schutz;
    n.satt=clamp(n.satt-4*d*taskMul,10,100);
    if(w==='nacht'&&(!activeTask||st.task.type==='traum')) n.ausgeruht=clamp(n.ausgeruht+(8+mods.nachtRegenPlus)*d0,10,100);
    else n.ausgeruht=clamp(n.ausgeruht-3*d*taskMul,10,100);
    const lmul=(n.satt<30||n.ausgeruht<30)?2:1;
    n.laune=clamp(n.laune-2*d*lmul*mods.launeMul,10,100);
    n.sauber=clamp(n.sauber-2*d*mods.sauberMul,10,100);
    t+=Math.min(step,rest);rest-=step;
  }
}

/* ---------- Schwung ---------- */
function refreshSchwung(st,t){
  t=t||nowMs();
  if(st.schwung>=SCHWUNG_MAX){st.schwungStamp=t;return}
  const n=Math.floor((t-st.schwungStamp)/SCHWUNG_TICK);
  if(n>0){
    st.schwung=Math.min(SCHWUNG_MAX,st.schwung+n);
    st.schwungStamp=st.schwung>=SCHWUNG_MAX?t:st.schwungStamp+n*SCHWUNG_TICK;
  }
}
function spendSchwung(n){
  refreshSchwung(S);
  if(S.schwung<n)return false;
  if(S.schwung>=SCHWUNG_MAX)S.schwungStamp=nowMs(); // Regeneration startet jetzt
  S.schwung-=n;
  UI.renderSchwung(true);
  saveNow();
  return true;
}
function schwungPlus(n){refreshSchwung(S);S.schwung=Math.min(SCHWUNG_MAX,S.schwung+n);UI.renderSchwung();}
function funkelPlus(st,n){st.funkel=Math.max(0,Math.round(st.funkel+n));if(st===S)UI.renderFunkel();}

/* ---------- Effektive Werte ---------- */
function effStats(st){
  const n=st.needs,s=st.stats;
  return {
    kraft:s.kraft*(0.5+0.5*n.satt/100),
    tempo:s.tempo*(0.5+0.5*n.ausgeruht/100),
    klugheit:s.klugheit*(0.5+0.5*n.sauber/100),
    herz:s.herz*(0.5+0.5*n.laune/100),
  };
}

/* ---------- Offline-Berechnung ---------- */
function offlineCatchup(st){
  const t=nowMs(); const events=[];
  if(t<st.lastSeen){ // Uhr zurückgestellt: nichts gutschreiben, aber normalisieren
    st.lastSeen=t;st.schwungStamp=Math.min(st.schwungStamp,t);
    const widBack=windowId(t);
    if(st.windowId!==widBack){st.windowId=widBack;st.care.fensterId=widBack;}
    if(st.task){
      const T=TASKS[st.task.type];
      const cap=st.task.type==='traum'?nextMorningMs(t):t+(T?T.dauerMin:20)*6e4;
      if(st.task.end>cap)st.task.end=cap;
    }
    if(st.pot&&st.pot.end>t+40*6e4)st.pot.end=t+40*6e4;
    return events;
  }
  const from=Math.max(st.lastSeen,t-14*36e5);
  applyDecay(st,from,t);
  refreshSchwung(st,t);
  if(st.task&&t>=st.task.end)events.push({typ:'bericht',task:st.task});
  if(st.pot&&t>=st.pot.end)events.push({typ:'gekocht'});
  // Beetkiste: alle 8 Stunden eine Zutat, höchstens 3 aufgelaufen
  if(hatObjekt(st,'beetkiste')){
    const n=Math.min(3,Math.floor((t-st.beetStamp)/(8*36e5)));
    if(n>0){events.push({typ:'beet',n});st.beetStamp=t;}
  } else st.beetStamp=t;
  const wid=windowId(t);
  if(wid!==st.windowId){
    st.windowId=wid;
    st.care={fensterId:wid,pet:false,wash:0,geweckt:false};
  }
  if(st.dailyFind.windowId!==wid){ // neuer Tagesfund liegt bereit
    st.dailyFind={windowId:wid,taken:false,typ:null,item:null};
  }
  st.lastSeen=t;
  return events;
}

const Sound=(()=>{
  let ctx=null;
  function ac(){ if(!ctx)try{ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} return ctx; }
  function blip(freq,dur,type,vol,when){
    if(!S||!S.settings.sound)return; const c=ac(); if(!c)return;
    if(c.state==='suspended')c.resume();
    const t=c.currentTime+(when||0);
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
    o.frequency.exponentialRampToValueAtTime(freq*1.06,t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.12,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+0.05);
  }

    stimme(){blip(620,0.12);blip(840,0.14,'sine',0.1,0.13)},

      fi.innerHTML=`<span>${z.emoji}</span><small>${z.name}</small><span class="cnt">${c}</span>`;

  },

  renderActions(){

    const w=windowOf(nowMs());

    if(S.stage>=2)mk('act-mehr','☰','Mehr');
  },

  /* Tagesfund: liegt vor der Höhle, einmal pro Fenster */
  renderTagesfund(){
    const tf=$('#tagesfund');
    const show=S&&!S.dailyFind.taken&&UI.screen==='home';
    tf.classList.toggle('on',!!show);
  },

  refreshHome(){

    this.applyPalette(w);
    this.renderSchwung();
    this.renderFunkel();
    this.renderDrawer();
    this.renderActions();
    this.renderTagesfund();

    if(S.task){ /* Statuszeile macht Away */ }
    else if(S.wakePending){ this.status('Pssst. '+S.name+' schläft noch. Tipp es wach.',true); }
    else if(Creature.isSleeping()){ this.status(S.name+' schläft. Wacht um 6 Uhr auf.',true); }
    else this.status('');

/* ============================================================
   GESTEN: Streicheln, Waschen, Ziehen, Füttern — am Wesen selbst
   ============================================================ */
const gestCss=document.createElement('style');
gestCss.textContent=`#wesen{transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px)))}`;
document.head.appendChild(gestCss);

const Gestures={
  sess:null, foodDrag:null,
  init(){
    const stage=$('#stage');
    document.addEventListener('pointermove',e=>{
      if(UI.screen==='home'&&!UI.anyOverlay()&&S&&!S.task){Creature.lastPointer=Date.now();Creature.headFollow(e.clientX,e.clientY)}
      this.move(e);
    },{passive:true});
    document.addEventListener('pointerup',e=>this.up(e));
    document.addEventListener('pointercancel',e=>this.up(e));
    $('#wesen').addEventListener('pointerdown',e=>this.down(e));
    $('#drawer').addEventListener('pointerdown',e=>{
      const fi=e.target.closest('.fooditem');if(!fi)return;
      this.foodDrag={kind:fi.dataset.dish?'dish':'zutat',id:fi.dataset.dish||fi.dataset.food,elmt:fi,x:e.clientX,y:e.clientY,active:false,moved:false};
    });
    $('#awaywalker').addEventListener('pointerdown',e=>{
      UI.pop(e.clientX,e.clientY,'💛');Sound.stimme();vibr(15);
    });
    // Wisch nach unten neben dem Wesen: rein in die Höhle
    let sw=null;
    $('#stage').addEventListener('pointerdown',e=>{
      if(e.target.closest('#wesen')||UI.anyOverlay()||UI.screen!=='home')return;
      sw={y0:e.clientY,t0:Date.now()};
    });
    document.addEventListener('pointermove',e=>{
      if(!sw)return;
      if(e.clientY-sw.y0>130&&Date.now()-sw.t0<700){sw=null;Cave.open()}
    },{passive:true});
    document.addEventListener('pointerup',()=>{sw=null});
  },
  ghostAt(x,y){const g=$('#dragGhost');g.style.left=(x-19-UI.appLeft())+'px';g.style.top=(y-24)+'px'},
  down(e){
    if(UI.anyOverlay()||!S||S.task)return;
    e.preventDefault();
    this.sess={x0:e.clientX,y0:e.clientY,lx:e.clientX,ly:e.clientY,t0:Date.now(),
      path:0,rev:0,lastSign:0,wind:0,petTicks:0,petAcc:0,mode:'unknown',washDone:false,
      sleepOnly:S.wakePending||Creature.isSleeping()};
  },
  move(e){
    if(this.foodDrag){
      const fd=this.foodDrag;
      const dx=e.clientX-fd.x,dy=fd.y-e.clientY;
      if(Math.hypot(dx,dy)>6)fd.moved=true;
      if(!fd.active){
        if(dy>16&&dy>Math.abs(dx)){
          fd.active=true;
          const g=$('#dragGhost');g.textContent=fd.elmt.querySelector('span').textContent;
          g.style.display='block';
        } else if(Math.abs(dx)>24&&Math.abs(dx)>dy){this.foodDrag=null;return} // horizontal: Leiste scrollt
      }
      if(fd.active)this.ghostAt(e.clientX,e.clientY);
      return;
    }
    const s=this.sess;if(!s)return;
    if(s.sleepOnly)return;
    const dx=e.clientX-s.lx,dy=e.clientY-s.ly;
    s.path+=Math.hypot(dx,dy);
    const sign=dx>1?1:dx<-1?-1:0;
    if(sign&&s.lastSign&&sign!==s.lastSign)s.rev++;
    if(sign)s.lastSign=sign;
    // Winding um Wesenmitte (für Waschen) — nahe der Mitte nicht zählen,
    // sonst kippt ein gerader Zug durch die Mitte den Winkel um pi
    const r=$('#wesen').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    const r1=Math.hypot(s.lx-cx,s.ly-cy),r2=Math.hypot(e.clientX-cx,e.clientY-cy);
    if(r1>34&&r2>34){
      const a1=Math.atan2(s.ly-cy,s.lx-cx),a2=Math.atan2(e.clientY-cy,e.clientX-cx);
      let da=a2-a1;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;
      s.wind+=da;
    }
    s.lx=e.clientX;s.ly=e.clientY;
    const disp=Math.hypot(e.clientX-s.x0,e.clientY-s.y0);
    if(s.mode==='unknown'&&disp>110&&s.rev<2&&Math.abs(s.wind)<1.2){s.mode='drag'}
    if(s.mode==='drag'){
      const w=$('#wesen');
      w.style.setProperty('--dx',clamp(e.clientX-s.x0,-160,160)+'px');
      w.style.setProperty('--dy',clamp((e.clientY-s.y0)*0.35,-40,40)+'px');
      return;
    }
    // Waschen: zwei volle Kreise
    if(!s.washDone&&Math.abs(s.wind)>2*2*Math.PI){
      s.washDone=true;s.mode='wash';Actions.wash(e.clientX,e.clientY);
    }
    // Streicheln: hin und her
    s.petAcc+=Math.hypot(dx,dy);
    if(s.rev>=1&&s.petAcc>85&&s.mode!=='wash'){
      s.petAcc=0;s.petTicks++;s.mode='pet';
      Actions.petTick(e.clientX,e.clientY,s.petTicks);
    }
    if(s.mode==='wash'&&Math.random()<0.3)UI.pop(e.clientX,e.clientY,'🫧');
  },
  up(e){
    if(this.foodDrag){
      const fd=this.foodDrag;this.foodDrag=null;
      $('#dragGhost').style.display='none';
      if(fd.active){
        const r=$('#wesen').getBoundingClientRect();
        const over=e.clientX>r.left-20&&e.clientX<r.right+20&&e.clientY>r.top-20&&e.clientY<r.bottom+30;
        if(over&&!$('#wesen').classList.contains('away'))Actions.feed(fd.kind,fd.id);
      } else if(!fd.moved){ /* nur angetippt: kleiner Hinweis */
        if(!S.seen.futterHint){S.seen.futterHint=true;saveNow();UI.toast('Zieh das Futter zu '+S.name+' hoch.')}
      }
      return;
    }
    const s=this.sess;if(!s)return;this.sess=null;
    const w=$('#wesen');
    const disp=Math.hypot(e.clientX-s.x0,e.clientY-s.y0);
    if(s.mode==='drag'){
      const appW=$('#app').clientWidth, ax=e.clientX-UI.appLeft();
      if(ax<40||ax>appW-40){
        w.style.setProperty('--dx','0px');w.style.setProperty('--dy','0px');
        Actions.openSend();
      } else if(disp>55){
        Actions.toben(e.clientX-s.x0,e.clientY-s.y0); // hüpft hinterher und wieder zurück
      } else {
        w.style.setProperty('--dx','0px');w.style.setProperty('--dy','0px');
      }
      return;
    }
    if(s.mode==='pet'){Actions.petEnd(s.petTicks);return}
    if(s.path<14&&Date.now()-s.t0<450)Actions.tap(e.clientX,e.clientY);
  },
};
/* ============================================================
   AKTIONEN v2: Pflege (frei), Toben, Training, Aufgaben, Berichte
   ============================================================ */
const Actions={
  /* ---------- Antippen ---------- */
  tap(x,y){
    if(!S)return;
    if(S.wakePending||Creature.isSleeping()){this.wakeTap(x,y);return}
    Creature.hop();Sound.stimme();vibr(12);
    if(Math.random()<0.4)UI.pop(x,y-30,'💛');
  },
  wakeTapCount:0,
  wakeTap(x,y){
    if(windowOf(nowMs())==='nacht'&&!S.wakePending){UI.pop(x,y-20,'💤');Sound.tief();return}
    this.wakeTapCount++;
    if(this.wakeTapCount===1){
      Creature.nuzzle();UI.pop(x,y-20,'💤');Sound.tief();
      UI.status('Noch ganz verschlafen. Tipp nochmal.',false);
    } else {
      this.wakeTapCount=0;
      S.care.geweckt=true;S.wakePending=false;
      Creature.render();Creature.hop();Sound.freude();vibr([20,40,20]);
      UI.toast('„'+rnd(DATA.traeume.wecksaetze).satz+'“',3200);
      saveNow();UI.refreshHome();
      if(S.pendingReport)setTimeout(()=>this.showReport(S.pendingReport),1600);
    }
  },

  /* ---------- Füttern: Zutaten und Gerichte, immer frei ---------- */
  feed(kind,id){
    if(Creature.isSleeping()){UI.toast(S.name+' schläft gerade.');return}
    if(S.needs.satt>=95){UI.toast(DATA.welt.microcopy.lehnt_ab.replace('{name}',S.name));Creature.nuzzle();return}
    let em,satt,laune=4,stat=null,statplus=0,fav=0,effekt=null;
    if(kind==='zutat'){
      const z=zutDef(id);if(!z||(S.inventory[id]||0)<=0)return;
      S.inventory[id]--;em=z.emoji;satt=z.satt;stat=z.stat;statplus=z.statplus;
    } else {
      if(id==='matsch'){
        if((S.dishes.matsch||0)<=0)return;
        S.dishes.matsch--;em=DATA2.matsch.emoji;satt=18;laune=8;
      } else {
        const r=rezDef(id);if(!r||(S.dishes[id]||0)<=0)return;
        S.dishes[id]--;em=r.emoji;satt=r.satt;laune=r.laune;stat=r.stat;statplus=r.statplus;effekt=r.effekt;
        // Nähe zum Lieblingsgericht: geteilte Zutaten
        const favR=rezDef(S.favourite);
        if(favR){
          if(id===S.favourite)fav=3;
          else{const gem=r.zutaten.filter(z=>favR.zutaten.includes(z)).length;fav=gem>=2?2:gem>=1?1:0}
        }
      }
    }
    S.needs.satt=clamp(S.needs.satt+satt,10,100);
    S.needs.laune=clamp(S.needs.laune+laune+(fav===3?18:fav*3),10,100);
    if(stat)S.stats[stat]+=statplus;
    S.counters.fuetterungen++;
    if(effekt==='schwung')schwungPlus(3);
    if(effekt==='kampf')S.buffs.kampf=1;
    if(effekt==='traum')S.buffs.traum=1;
    if(effekt==='schutz')S.buffs.schutzUntil=nowMs()+36e5;
    const r=$('#wesen').getBoundingClientRect();
    UI.pop(r.left+r.width/2,r.top+r.height*0.45,em);
    setTimeout(()=>{Creature.hop();Sound.mampf();vibr(18);
      UI.sparkleAt(r.left+r.width/2,r.top+r.height*0.5,ELEMENTS[S.element].farbe);
      if(fav>0){UI.toast('„'+DATA2.microcopy2.favorit[fav-1]+'“',3600);
        if(fav===3){Sound.fanfare();vibr([30,50,30,50,80]);
          for(let i=0;i<6;i++)setTimeout(()=>UI.pop(r.left+r.width/2+(Math.random()*100-50),r.top+r.height*0.3,'💖'),i*160)}}
      else if(effekt&&effekt!=='keiner'){
        UI.toast({kampf:'Da ist Kampfgeist drin.',traum:'Heute Nacht wird tief geträumt.',schwung:'Der Schwung ist gleich wieder da.',schutz:'Das hält lange vor.'}[effekt]||'',2600)}
    },350);
    Creature.refreshGlow();UI.renderDrawer();saveNow();
  },

  /* ---------- Streicheln / Waschen (frei) ---------- */
  petTick(x,y,n){
    S.needs.laune=clamp(S.needs.laune+0.7,10,100);
    UI.pop(x,y-10,['💛','✨','💛','🩷'][n%4]);
    if(n%2)Sound.plink();vibr(8);
    Creature.refreshGlow();
    if(n===3)Creature.nuzzle();
  },
  petEnd(ticks){
    if(ticks>=6&&!S.care.pet){
      S.care.pet=true;S.stats.herz+=1;S.counters.streicheln++;
      Creature.hop();Sound.freude();
    }
    saveNow();
  },
  wash(x,y){
    const dirty=S.needs.sauber<80;
    S.needs.sauber=clamp(S.needs.sauber+40,10,100);
    if(!S.care.wash){S.care.wash=1;S.stats.herz+=0.5;S.counters.gewaschen++}
    for(let i=0;i<6;i++)setTimeout(()=>UI.pop(x+Math.random()*80-40,y+Math.random()*60-30,'🫧'),i*120);
    setTimeout(()=>{Creature.render();Creature.hop();Sound.freude();vibr([15,30,15]);
      if(dirty)UI.toast('Wieder blitzeblank.')},900);
    saveNow();
  },

  /* ---------- Toben: reines Spielzeug, kein Limit ---------- */
  toben(dx,dy){
    const w=$('#wesen');
    w.style.transition='transform .35s cubic-bezier(.3,1.5,.5,1)';
    w.style.setProperty('--dx',clamp(dx,-140,140)+'px');
    w.style.setProperty('--dy',clamp(dy*0.5,-60,40)+'px');
    Creature.hop();Sound.stimme();vibr([10,20,10]);
    S.counters.getobt=Math.min(500,S.counters.getobt+1);
    S.needs.laune=clamp(S.needs.laune+0.4,10,100);

      const r=w.getBoundingClientRect();

      if(Math.random()<0.4)UI.toast('„'+rnd(DATA2.microcopy2.toben)+'“',1800);
    }
    clearTimeout(this._tobT);
    this._tobT=setTimeout(()=>{
      w.style.setProperty('--dx','0px');w.style.setProperty('--dy','0px');
      setTimeout(()=>{w.style.transition=''},400);
    },700);
    Creature.refreshGlow();saveNow();
  },

  /* ---------- Training (Mittag, 2 Schwung) ---------- */
  training(){
    refreshSchwung(S);
    if(S.schwung<2){UI.schwungLeerHint();return}
    spendSchwung(2);
    const mods=caveMods(S);
    const k=Math.round((2+Math.random()*2)*mods.trainMul);
    S.stats.kraft+=k;S.stats.tempo+=1;
    S.counters.trainiert++;
    const r=$('#wesen').getBoundingClientRect();
    UI.pop(r.left+r.width/2,r.top+r.height*0.3,'🪨');
    Creature.hop();setTimeout(()=>Creature.hop(),400);setTimeout(()=>Creature.hop(),800);
    Sound.trommel();vibr([25,40,25]);
    setTimeout(()=>{UI.toast('„'+rnd(DATA2.microcopy2.training)+'“'+(S.stage>=2?' (💪 +'+k+')':''),3200);Sound.freude()},1000);
    saveNow();
  },

  /* ---------- Losschicken ---------- */
  sendSel:{task:null,focus:null},
  openSend(){
    if(S.task)return;
    const w=windowOf(nowMs());
    const avail=Object.entries(TASKS).filter(([id,t])=>t.fenster.includes(w));
    if(!avail.length)return;
    refreshSchwung(S);
    this.sendSel={task:avail[0][0],focus:'erkunden'};
    const tr=$('#taskrow');tr.innerHTML='';
    avail.forEach(([id,t])=>{
      const b=el('button','taskbtn'+(id===this.sendSel.task?' sel':''));
      b.innerHTML=`<span class="em">${t.em}</span>${t.name}<small>${t.desc} · ${'⚡'.repeat(t.schwung>3?3:t.schwung)}${t.schwung>3?'+':''}</small>`;
      b.onclick=()=>{this.sendSel.task=id;[...tr.children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel')};
      tr.appendChild(b);
    });
    const fg=$('#focusgrid');fg.innerHTML='';
    fg.style.display=(w==='nacht')?'none':'grid';
    Object.entries(FOCUS).forEach(([id,f])=>{
      const b=el('button','focusbtn'+(id===this.sendSel.focus?' sel':''));
      b.innerHTML=`<span class="em">${f.em}</span>${f.name}`;
      b.onclick=()=>{this.sendSel.focus=id;[...fg.children].forEach(c=>c.classList.remove('sel'));b.classList.add('sel')};
      fg.appendChild(b);
    });
    $('#sendtitle').textContent=w==='nacht'?'Traumreise':'Wohin soll '+S.name+'?';
    UI.overlay('ov-send');
  },
  confirmSend(){
    const {task,focus}=this.sendSel;if(!task)return;
    const t=TASKS[task];const now=nowMs();
    if(!spendSchwung(t.schwung)){UI.overlay('ov-send',false);UI.schwungLeerHint();return}
    const end=task==='traum'?nextMorningMs(now):now+t.dauerMin*6e4;
    S.task={type:task,focus,start:now,end};
    if(task==='traum'){S.counters.traeume++;Creature.render();
      UI.toast(S.name+' rollt sich ein und träumt los.',3000);Sound.tief();}
    else Sound.stimme();
    UI.overlay('ov-send',false);
    UI.refreshHome();saveNow();
  },
  startTraum(){
    refreshSchwung(S);
    if(S.schwung<TASKS.traum.schwung){UI.schwungLeerHint();return}
    this.sendSel={task:'traum',focus:'traum'};
    spendSchwung(TASKS.traum.schwung);
    const now=nowMs();
    S.task={type:'traum',focus:'traum',start:now,end:nextMorningMs(now)};
    S.counters.traeume++;
    Creature.render();UI.refreshHome();saveNow();
    UI.toast(S.name+' rollt sich ein und träumt los.',3000);Sound.tief();
  },

  /* ---------- Aufgabe fertig → Bericht ---------- */
  completeTask(task){
    const isTraum=task.type==='traum';
    const lenF={streifzug:1,sammelgang:2.2,wanderung:3.6,traum:3.6}[task.type]||1;
    const mods=caveMods(S);
    const gains={},loot={};let extra=null;
    const add=(k,v)=>{if(v>0)gains[k]=(gains[k]||0)+v};
    let funkel=0;
    if(isTraum){
      let klug=(3+Math.random()*2)*mods.traumMul*mods.klugMul;
      if(S.buffs.traum){klug*=1.5;S.buffs.traum=0;}
      add('klugheit',Math.round(klug));
      funkel=8+Math.round(Math.random()*6);
    } else {
      if(task.focus==='training'){add('kraft',Math.round(lenF*(1+Math.random())*mods.trainMul));add('tempo',Math.round(lenF*0.6))}
      if(task.focus==='erkunden'){add('klugheit',Math.round(lenF*(0.8+Math.random()*0.7)*mods.klugMul))}
      if(task.focus==='ruhe'){S.needs.ausgeruht=clamp(S.needs.ausgeruht+10+lenF*5,10,100);S.needs.laune=clamp(S.needs.laune+8,10,100);add('herz',Math.round(lenF*0.5))}
      if(task.focus==='essen'){S.needs.satt=clamp(S.needs.satt+8,10,100)}
      const nLoot=(task.focus==='essen'?2:1)+Math.round(Math.random()*lenF);
      for(let i=0;i<nLoot;i++){
        let pool=DATA2.zutaten.filter(z=>z.tier==='haeufig');
        if(task.type==='wanderung'&&Math.random()<0.3)pool=DATA2.zutaten.filter(z=>z.tier==='rar');
        else if(task.type!=='streifzug'&&Math.random()<0.35)pool=DATA2.zutaten.filter(z=>z.tier==='selten');
        const z=rnd(pool);
        loot[z.id]=(loot[z.id]||0)+1;
      }
      Object.entries(loot).forEach(([id,n])=>{S.inventory[id]=(S.inventory[id]||0)+n});
      funkel={streifzug:4,sammelgang:9,wanderung:18}[task.type]+Math.round(Math.random()*lenF*3);
      // Wanderung: Chance auf ein Höhlenobjekt
      if(task.type==='wanderung'&&Math.random()<0.2){
        const kaufbar=DATA2.objekte.filter(o=>o.preis>0&&!S.cave.ownedItems.includes(o.id));
        if(kaufbar.length){const o=rnd(kaufbar);S.cave.ownedItems.push(o.id);
          S.cave.items.push({id:o.id,x:0.2+Math.random()*0.6,y:0.4+Math.random()*0.35});
          extra=o;}
      }
    }
    funkelPlus(S,funkel);
    Object.entries(gains).forEach(([k,v])=>{S.stats[k]+=v});
    const rep=this.buildReport(task,gains,loot,isTraum,funkel,extra);
    S.log.unshift(rep);S.log=S.log.slice(0,20);
    S.task=null;
    return rep;
  },
  buildReport(task,gains,loot,isTraum,funkel,extra){
    const B=DATA.berichte,mc=DATA.welt.microcopy;
    let text='',icons=[],title='',ids=[];
    if(isTraum){
      title=rnd(mc.traum_titel);
      const frags=[];const pool=[...DATA.traeume.traumfragmente];
      for(let i=0;i<2&&pool.length;i++){const f=pool.splice(Math.floor(Math.random()*pool.length),1)[0];frags.push(f)}
      text=frags.map(f=>f.satz).join(' ')+' '+rnd(DATA.traeume.traumschluss).satz;
      icons=['🌙',...frags.map(f=>f.emoji)];
    } else {
      title=rnd(mc.rueckkehr_titel);
      const wz=windowOf(task.start);
      const recent=S.log.slice(0,6).flatMap(r=>r.ids||[]);
      const orte=B.orte.filter(o=>o.tageszeit.includes(wz)&&!recent.includes(o.id));
      const ort=rnd(orte.length?orte:B.orte);
      const evs=B.ereignisse.filter(e=>e.tageszeit.includes(wz)&&e.fokus.includes(task.focus)&&!recent.includes(e.id));
      const evPool=evs.length?evs:B.ereignisse.filter(e=>e.tageszeit.includes(wz));
      const ev1=rnd(evPool.length?evPool:B.ereignisse);
      let parts=[ort.satz,ev1.satz];icons=[ort.emoji,ev1.emoji];
      ids=[ort.id,ev1.id];
      if(task.type!=='streifzug'&&Math.random()<0.75){
        const p2=evPool.filter(e=>e.id!==ev1.id);
        if(p2.length){const ev2=rnd(p2);parts.push(ev2.satz);icons.push(ev2.emoji);ids.push(ev2.id)}
      }
      const lootIds=Object.keys(loot);
      if(lootIds.length){
        const z=zutDef(lootIds[0]);
        parts.push(fundSatz(z,loot[lootIds[0]]));
        icons.push(z.emoji);
      }
      if(extra){parts.push('Und dann hab ich noch was Großes gefunden: '+extra.name+'. Steht schon in der Höhle.');icons.push(extra.emoji)}
      const unseenRare=B.selten.filter(r=>!S.seenRare.includes(r.id));
      if(unseenRare.length&&(task.type==='wanderung'||task.focus==='erkunden')&&Math.random()<0.3){
        const r=rnd(unseenRare);S.seenRare.push(r.id);
        parts.push(r.satz);icons.push(r.emoji);
      }
      const schl=B.schluss.filter(s=>!s.fokus||!s.fokus.length||s.fokus.includes(task.focus));
      parts.push(rnd(schl.length?schl:B.schluss).satz);
      text=parts.join(' ');
    }
    return {t:nowMs(),typ:isTraum?'traum':task.type,title,text,icons:icons.slice(0,4),
      gains,loot,funkel,ids:isTraum?[]:ids};
  },
  showReport(rep){
    if(S.pendingReport===rep)S.pendingReport=null;
    $$('.overlay').forEach(o=>o.classList.remove('on'));
    $('#toast').classList.remove('on');
    $('#reporttitle').textContent=rep.title;
    $('#reporticons').textContent=rep.icons.join(' ');
    $('#reporttext').textContent=rep.text;

const Games={
  current:null,raf:0,gen:0,rewarded:false,tier:0,
  abort(){this.gen++;cancelAnimationFrame(this.raf)},
  tierOf(id){
    const b=S.highs[id]||0;

  end(id,score,best,line,statGain,gen){
    if(gen!==undefined&&gen!==this.gen)return; // Geisterspiel: still verwerfen
    cancelAnimationFrame(this.raf);
    const prevBest=S.highs[id]||0,isBest=score>prevBest;
    if(isBest)S.highs[id]=score;

      if(S.stage>=2)chips=`<div class="chip2" style="display:inline-block;margin-top:8px">${STATEM[statGain.stat]} +${v} ${STATNAMES[statGain.stat]}</div>
        <div class="chip2" style="display:inline-block;margin-top:8px">✦ +${funkel}</div>`;
    } else {
      chips='<div style="opacity:.6;font-size:.85em;margin-top:8px">Zum Spaß gespielt — die Bestleistung zählt.</div>';
    }

    const zeroCase=score<=0;
    $('#gamebody').innerHTML=`<div id="gameresult">
      <div style="font-size:44px">${statGain.em}</div>
      <div>${zeroCase?'Das war ein Anfang. Gleich nochmal?':line}</div>
      <div class="rscore">${zeroCase?'✨':score}</div>
      <div class="rbest">${zeroCase?'':(isBest?'Neue Bestleistung! ✨':'Bestleistung: '+(S.highs[id]||0))}</div>
      ${chips}
    </div>`;

  },

  /* --- Beerenfang --- */
  beeren(){
    const gen=this.gen;
    $('#gametitle').textContent='Beerenfang';
    const area=$('#gamearea');
    area.innerHTML=`<div id="gcatcher">${svgWesen({element:S.element,stage:S.stage,knirps:S.knirps,form:S.form,variant:S.variant,look:S.look,glow:'hell',glowOp:1})}</div>`;
    const cat=$('#gcatcher');
    let cx=area.clientWidth/2,target=cx,caught=0,missed=0,spawned=0,items=[],t0=performance.now(),last=t0;
    const total=[18,22,26][this.tier], speedT=1+this.tier*0.25, good=['🫐','🍓','🍇','🌰'],bad=['🍂','🪨'];
    const speedLerp=0.06+0.10*clamp(effStats(S).tempo/60,0,1);
    area.addEventListener('pointermove',e=>{const r=area.getBoundingClientRect();target=e.clientX-r.left},{passive:true});
    area.addEventListener('pointerdown',e=>{const r=area.getBoundingClientRect();target=e.clientX-r.left},{passive:true});
    const hud=$('#gamehud');
    const loop=(t)=>{
      if(gen!==Games.gen)return;
      const dt=Math.min(40,t-last);last=t;
      cx+=(target-cx)*speedLerp*(dt/16);
      cx=clamp(cx,40,area.clientWidth-40);
      cat.style.left=(cx-43)+'px';
      if(spawned<total&&Math.random()<0.028*(dt/16)){
        spawned++;
        const isGood=Math.random()<0.72;
        const d=el('div','falling',isGood?rnd(good):rnd(bad));
        d.dataset.good=isGood?'1':'';
        d.dataset.x=40+Math.random()*(area.clientWidth-80);
        d.dataset.y=-30;d.dataset.v=(1.9+Math.random()*1.4+spawned*0.05)*speedT;
        d.style.transform=`translate(${d.dataset.x}px,-30px)`;
        area.appendChild(d);items.push(d);
      }
      items=items.filter(d=>{
        let y=parseFloat(d.dataset.y)+parseFloat(d.dataset.v)*(dt/16);
        d.dataset.y=y;
        d.style.transform=`translate(${d.dataset.x}px,${y}px)`;
        const catchY=area.clientHeight-92;
        if(y>catchY&&y<catchY+56&&Math.abs(parseFloat(d.dataset.x)+18-cx)<46){
          if(d.dataset.good){caught++;UI.sparkleAt0(area,d);Sound.plink();vibr(10)}
          else{missed++;Sound.tief();cat.style.filter='grayscale(.6)';setTimeout(()=>cat.style.filter='',420)}
          d.remove();return false;
        }
        if(y>area.clientHeight){d.remove();return false}
        return true;
      });
      hud.textContent='🫐 '+caught;
      if(spawned>=total&&!items.length){
        this.end('beeren',caught,0,'Gefangen:',{stat:'tempo',v:Math.max(1,Math.round(caught/4)),em:'🫐'},gen);
        return;
      }
      this.raf=requestAnimationFrame(loop);
    };
    UI.sparkleAt0=(area,d)=>{const r=area.getBoundingClientRect();UI.pop(r.left+parseFloat(d.dataset.x)+14,r.top+parseFloat(d.dataset.y),'✨')};
    this.raf=requestAnimationFrame(loop);
  },

  /* --- Echofolge (Simon) --- */
  echo(){
    const gen=this.gen;
    $('#gametitle').textContent='Echofolge';
    const area=$('#gamearea');
    const stones=[{c:'#e8756d',s:'●'},{c:'#e8b931',s:'▲'},{c:'#6fb3a8',s:'■'},{c:'#9a8fe8',s:'✦'}];
    area.innerHTML='<div class="simonwrap">'+stones.map((st,i)=>
      `<button class="simonstone" data-i="${i}" style="--stc:${st.c};--stg:${st.c}">${st.s}</button>`).join('')+'</div>';
    const btns=[...area.querySelectorAll('.simonstone')];
    const seq=[];let inputPos=0,playing=true,round=0;
    const maxR=[8,10,12][this.tier];
    const showMs=(620+380*clamp(effStats(S).klugheit/60,0,1))*[1,.85,.72][this.tier];
    const tones=[392,494,587,740];
    const lit=(i,ms)=>{btns[i].classList.add('lit');
      if(S.settings.sound){Sound.plink()}
      setTimeout(()=>btns[i].classList.remove('lit'),ms||showMs*0.6)};
    const playSeq=async()=>{
      playing=true;$('#gamehud').textContent='Schau gut hin … Runde '+round;
      await new Promise(r=>setTimeout(r,800));
      if(gen!==Games.gen)return;
      for(const i of seq){if(gen!==Games.gen)return;lit(i);await new Promise(r=>setTimeout(r,showMs))}
      if(gen!==Games.gen)return;
      playing=false;inputPos=0;$('#gamehud').textContent='Jetzt du.';
    };
    const next=()=>{if(gen!==Games.gen)return;seq.push(Math.floor(Math.random()*4));round++;playSeq()};
    btns.forEach(b=>b.onclick=()=>{
      if(playing||gen!==Games.gen)return;
      const i=+b.dataset.i;lit(i,260);vibr(10);
      if(i===seq[inputPos]){inputPos++;
        if(inputPos>=seq.length){
          playing=true; // Doppeltipp bis zur nächsten Runde ignorieren
          if(round>=maxR){this.end('echo',round,0,'Runden geschafft:',{stat:'klugheit',v:Math.max(1,Math.round(round/2)),em:'🪨'},gen);return}
          $('#gamehud').textContent='Genau richtig.';
          setTimeout(next,700);
        }
      } else {
        this.end('echo',round-1<0?0:round-1,0,'Runden geschafft:',{stat:'klugheit',v:Math.max(1,Math.round(round/2)),em:'🪨'},gen);
      }
    });
    next();
  },

  /* --- Rhythmusklopfen --- */
  rhythmus(){
    const gen=this.gen;
    $('#gametitle').textContent='Rhythmusklopfen';
    const area=$('#gamearea');
    area.innerHTML=`<div id="rhywrap"><div id="rhydrum">🥁</div><div id="rhymsg" style="font-weight:700;min-height:1.6em"></div></div>`;
    const drum=$('#rhydrum'),msg=$('#rhymsg');
    const tol=300+220*clamp(effStats(S).herz/60,0,1);
    let score=0,roundN=0,expect=[],taps=[],listening=false;
    const maxRounds=4+this.tier;
    const patterns=[[0,500,1000],[0,400,800,1200],[0,300,600,1200],[0,350,700,1050,1400],[0,300,600,900,1350],[0,250,500,1000,1250,1500]];
    const beat=()=>{if(gen!==Games.gen)return;drum.classList.remove('beat');void drum.offsetWidth;drum.classList.add('beat');Sound.trommel();vibr(20)};
    const playRound=async()=>{
      if(gen!==Games.gen)return;
      roundN++;
      if(roundN>maxRounds){this.end('rhythmus',score,0,'Im Takt getroffen:',{stat:'herz',v:Math.max(1,Math.round(score/3)),em:'🥁'},gen);return}
      const pat=patterns[Math.min(roundN-1,patterns.length-1)];
      msg.textContent='Hör zu …';listening=false;
      await new Promise(r=>setTimeout(r,900));
      if(gen!==Games.gen)return;
      for(const p of pat){setTimeout(beat,p)}
      await new Promise(r=>setTimeout(r,pat[pat.length-1]+600));
      if(gen!==Games.gen)return;
      msg.textContent='Jetzt du. Klopf mit.';
      expect=pat;taps=[];listening=true;
      const start=performance.now();
      // Toleranz nie größer als der halbe Schlagabstand
      let minGap=1e9;for(let i=1;i<pat.length;i++)minGap=Math.min(minGap,pat[i]-pat[i-1]);
      const tol2=Math.min(tol,minGap*0.45);
      const check=setInterval(()=>{
        if(gen!==Games.gen){clearInterval(check);return}
        if(performance.now()-start>pat[pat.length-1]+1800){
          clearInterval(check);listening=false;
          // jeder Tipp zählt höchstens für einen Schlag
          let hit=0;const used=new Set();
          expect.forEach(pt=>{
            let best=-1,bd=1e9;
            taps.forEach((tp,ti)=>{if(!used.has(ti)){const dd=Math.abs(tp-pt);if(dd<bd){bd=dd;best=ti}}});
            if(best>=0&&bd<tol2){hit++;used.add(best)}
          });
          score+=hit;
          msg.textContent=hit===expect.length?'Genau richtig. ✨':hit>0?'Fast. Weiter geht’s.':'Macht nichts. Nochmal.';
          Sound.freude();
          setTimeout(playRound,1100);
        }
      },120);
      area.onpointerdown=()=>{if(!listening||gen!==Games.gen)return;
        taps.push(performance.now()-start);beat();};
    };
    playRound();
  },
};
/* ============================================================
   KAMPF & FREUNDESCODE
   ============================================================ */
const B36='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const ELIDX=['glut','tau','moos','funke'];
const FORMIDX=[null,'wehr','flink','traum','herz'];
function b36(n,len){n=clamp(Math.round(n),0,Math.pow(36,len)-1);let s='';
  do{s=B36[n%36]+s;n=Math.floor(n/36)}while(n>0);return s.padStart(len,'0')}
function encodeCode(st){
  let d='G1'+b36(ELIDX.indexOf(st.element),1)+b36(st.stage,1)+b36(Math.max(0,FORMIDX.indexOf(st.form)),1)
    +b36(st.stats.kraft,2)+b36(st.stats.tempo,2)+b36(st.stats.klugheit,2)+b36(st.stats.herz,2);
  let sum=0;for(const c of d)sum+=B36.indexOf(c)>=0?B36.indexOf(c):0;
  d+=B36[sum%36];
  const nm=(st.name||'').toUpperCase().replace(/[^A-ZÄÖÜ]/g,'').slice(0,8);
  return d+(nm?'-'+nm:'');
}
function decodeCode(raw){
  const s=(raw||'').trim().toUpperCase();
  const m=s.match(/^G1([0-9A-Z]{12})(?:-([A-ZÄÖÜ]{1,8}))?$/);
  if(!m)return null;
  const d='G1'+m[1];
  let sum=0;for(const c of d.slice(0,-1))sum+=B36.indexOf(c);
  if(B36[sum%36]!==d[d.length-1])return null;
  const q=m[1].slice(0,11); // letztes Zeichen ist die Prüfsumme
  const v=(i,l)=>parseInt(q.slice(i,i+l),36);
  const st={element:ELIDX[v(0,1)]||'glut',stage:clamp(v(1,1),1,3),form:FORMIDX[v(2,1)]||null,
    stats:{kraft:v(3,2),tempo:v(5,2),klugheit:v(7,2),herz:v(9,2)},name:m[2]||'Fremdes Wesen'};
  if(st.stage<2)st.form=null;
  return st;
}

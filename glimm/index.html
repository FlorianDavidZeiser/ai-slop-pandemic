<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>GLIMM</title>
<style>
/* ============================================================
   GLIMM — ein Wesen, das ein Licht in sich trägt
   Single-File. Keine externen Requests. Kein Build.
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:-apple-system,'SF Pro Rounded','Segoe UI',Roboto,'Noto Sans',sans-serif;
  background:#0c1226;color:var(--ink,#2c3038);
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  font-size:17px;line-height:1.45;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input{font:inherit}
svg{display:block}

/* ---------- Tageszeit-Paletten ---------- */
#app{
  --sky1:#b9dcea;--sky2:#eef6ee;--hill1:#a5c9ad;--hill2:#83b191;--hill3:#63997c;
  --ground:#8fbf9c;--accent:#5fa89a;--ink:#2c3a3a;--chrome:rgba(255,255,255,.55);
  --card:#fffaf0;--cardink:#33313d;--soft:rgba(30,50,50,.10);
  --starop:0;--sunc:#fff3c9;--heart:#e8756d;
  position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;
  color:var(--ink);
}
#app.t-mittag{--sky1:#5eb1e4;--sky2:#f4eec0;--hill1:#8cc262;--hill2:#68ad4c;--hill3:#4c953e;
  --ground:#74b656;--accent:#e8935a;--ink:#27392c;--chrome:rgba(255,255,255,.6);--sunc:#ffd95e}
#app.t-abend{--sky1:#e0795c;--sky2:#f7cf92;--hill1:#b08370;--hill2:#8f6668;--hill3:#6d4c5c;
  --ground:#9c7466;--accent:#e8875a;--ink:#3d2a30;--chrome:rgba(255,244,224,.5);--sunc:#ff9d47}
#app.t-nacht{--sky1:#0d1b3e;--sky2:#2b4674;--hill1:#22335a;--hill2:#1a2947;--hill3:#121d33;
  --ground:#1b2c4d;--accent:#8fa8d8;--ink:#e6ebf7;--chrome:rgba(20,32,64,.45);
  --soft:rgba(0,0,20,.3);--starop:1;--sunc:#f3edda}

/* ---------- Himmel & Landschaft ---------- */
#sky{position:absolute;inset:0;background:linear-gradient(var(--sky1),var(--sky2) 70%);
  transition:background 2.5s ease}
#skyfade{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity 2.2s ease}
#stars{position:absolute;inset:0 0 30% 0;opacity:var(--starop);transition:opacity 2.5s ease;pointer-events:none}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#f5f2e2;
  animation:twinkle 3.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.9}50%{opacity:.25}}
#orb{position:absolute;width:74px;height:74px;border-radius:50%;background:var(--sunc);
  filter:blur(1px);box-shadow:0 0 46px 18px var(--sunc);opacity:.9;
  transition:all 2.5s ease;pointer-events:none}
#hills{position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none}
#hills svg{width:100%;height:100%}
.hillA{fill:var(--hill1)}.hillB{fill:var(--hill2)}.hillC{fill:var(--hill3)}
.hillA,.hillB,.hillC{transition:fill 2.5s ease}
#fireflies{position:absolute;inset:30% 0 20% 0;pointer-events:none;opacity:var(--starop);transition:opacity 2s}
.ffly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a0;
  box-shadow:0 0 8px 3px rgba(255,233,160,.6);animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate(0,0);opacity:.2}30%{opacity:.95}60%{opacity:.3}100%{transform:translate(46px,-34px);opacity:.85}}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.overlay{position:absolute;inset:0;display:none;z-index:40;flex-direction:column;
  align-items:center;justify-content:center;padding:22px;
  background:rgba(14,18,34,.55);backdrop-filter:blur(3px)}
.overlay.on{display:flex}
.card{background:var(--card);color:var(--cardink);border-radius:24px;
  padding:22px 20px;max-width:420px;width:100%;box-shadow:0 14px 44px rgba(10,14,30,.35);
  max-height:86vh;max-height:86dvh;overflow-y:auto;overscroll-behavior:contain}
.card h2{font-size:1.25em;font-weight:800;letter-spacing:.01em;margin-bottom:10px}
.bigbtn{display:block;width:100%;min-height:60px;border-radius:18px;
  background:var(--accent);color:#fff;font-weight:700;font-size:1.05em;
  box-shadow:0 4px 0 rgba(0,0,0,.15);margin-top:12px;padding:12px 16px}
.bigbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.bigbtn.ghost{background:transparent;color:var(--cardink);box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
.bigbtn.ghost:active{transform:translateY(1px)}

/* ---------- Top-Chrome ---------- */
#chrome{position:absolute;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;
  justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.chip{width:52px;height:52px;border-radius:50%;background:var(--chrome);
  display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
  box-shadow:0 2px 10px var(--soft);transition:background 2s ease}
.chip:active{transform:scale(.92)}
.chip svg{width:26px;height:26px}
.chip .st{stroke:var(--ink);transition:stroke 2s ease}
#hearts{display:flex;gap:8px;background:var(--chrome);border-radius:999px;
  padding:9px 14px;backdrop-filter:blur(6px);box-shadow:0 2px 10px var(--soft);transition:background 2s ease}
.hbeat{width:24px;height:24px;transition:transform .3s}
.hbeat path{fill:var(--heart);transition:fill .5s,opacity .5s}
.hbeat.off path{fill:none;stroke:var(--ink);stroke-width:2;opacity:.45}
.hbeat.spend{animation:hspend .55s ease}
@keyframes hspend{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}

/* ---------- Statuszeile ---------- */
#statusline{position:absolute;left:0;right:0;top:calc(72px + env(safe-area-inset-top));
  text-align:center;z-index:25;pointer-events:none;padding:0 24px}
#statusline span{display:inline-block;background:var(--chrome);border-radius:999px;
  padding:7px 16px;font-size:.92em;backdrop-filter:blur(6px);color:var(--ink);
  box-shadow:0 2px 10px var(--soft);transition:background 2s ease,color 2s ease;
  opacity:0;transform:translateY(-6px);transition:opacity .6s,transform .6s}
#statusline span.on{opacity:1;transform:none}

/* ---------- Wesen-Bühne ---------- */
#stage{position:absolute;inset:0;z-index:10}
#wesen{position:absolute;left:50%;top:56%;width:min(64vw,300px);aspect-ratio:1;
  transform:translate(-50%,-50%);touch-action:none;cursor:pointer;
  transition:filter 1.5s ease}
#wesen.away{display:none}
#wesen svg{width:100%;height:100%;overflow:visible}
.w-shadow{fill:rgba(10,14,30,.18);transition:all 2s}
.t-abend .w-shadow{transform:scaleX(1.9) translateX(-14px);opacity:.75}
.t-nacht .w-shadow{opacity:.4}
#wesen .breath{animation:breathe 3.2s ease-in-out infinite;transform-origin:100px 132px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.028,1.045)}}
#wesen.sleeping .breath{animation-duration:5s}
#wesen .headg{transition:transform .25s ease-out;transform-origin:100px 108px}
#wesen .eyes-w{transform-origin:center;transition:transform .12s}
#wesen.blink .eyes-w{transform:scaleY(.08)}
#wesen.sleeping .eyes-w{transform:scaleY(.08)}
#wesen .pupils{transition:transform .3s}
#wesen.happy-hop{animation:hop .5s ease}
@keyframes hop{0%,100%{transform:translate(-50%,-50%)}35%{transform:translate(-50%,-58%) scale(1.04,.97)}65%{transform:translate(-50%,-49%) scale(.98,1.03)}}
#wesen.nuzzle svg{animation:nuzzle .9s ease}
@keyframes nuzzle{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}70%{transform:rotate(4deg)}}
#wesen.sad .mouth-happy{display:none}
#wesen .mouth-sad{display:none}
#wesen.sad .mouth-sad{display:block}
#wesen.sad .earL{transform:rotate(-14deg)}#wesen.sad .earR{transform:rotate(14deg)}
.earL,.earR{transition:transform .8s;transform-origin:100px 70px}

/* Glimmen — die Statusanzeige */
.glim{transform-origin:100px 128px}
.glim-hell{animation:gHell 3.6s ease-in-out infinite}
@keyframes gHell{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(1.07)}}
.glim-ruhig{animation:gRuhig 4.2s ease-in-out infinite}
@keyframes gRuhig{0%,100%{opacity:.8}50%{opacity:.62}}
.glim-flackern{animation:gFlack 1.15s linear infinite}
@keyframes gFlack{0%{opacity:.85}12%{opacity:.3}24%{opacity:.75}35%{opacity:.42}55%{opacity:.88}68%{opacity:.25}82%{opacity:.7}100%{opacity:.85}}
.glim-langsam{animation:gLang 6.5s ease-in-out infinite}
@keyframes gLang{0%,100%{opacity:.55;transform:scale(.95)}50%{opacity:.2;transform:scale(.88)}}
.glim-trueb{animation:gTrueb 5s ease-in-out infinite;filter:saturate(.25)}
@keyframes gTrueb{0%,100%{opacity:.35}50%{opacity:.25}}
.dirt{opacity:0;transition:opacity 1.2s}
#wesen.dirty .dirt{opacity:.85}

/* Herzchen / Partikel */
.pop{position:absolute;z-index:35;pointer-events:none;font-size:22px;
  animation:popup 1.1s ease forwards}
@keyframes popup{0%{opacity:0;transform:translateY(6px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-52px) scale(1.15)}}
.sparkle{position:absolute;z-index:35;pointer-events:none;width:8px;height:8px;border-radius:50%;
  animation:sprk .8s ease forwards}
@keyframes sprk{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6) translateY(-26px)}}

/* ---------- Futterleiste ---------- */
#drawer{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:30;background:var(--chrome);backdrop-filter:blur(8px);
  border-radius:26px;padding:10px 12px;display:flex;gap:6px;max-width:92%;
  overflow-x:auto;box-shadow:0 4px 16px var(--soft);transition:background 2s ease;
  scrollbar-width:none}
#drawer::-webkit-scrollbar{display:none}
.fooditem{min-width:58px;height:72px;border-radius:18px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:30px;touch-action:none;
  position:relative;background:rgba(255,255,255,.35)}
.t-nacht .fooditem{background:rgba(255,255,255,.08)}
.fooditem small{font-size:10px;max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--ink);opacity:.85}
.fooditem .cnt{position:absolute;top:2px;right:4px;font-size:11px;font-weight:800;color:var(--ink);opacity:.7}
.fooditem.dragging{opacity:.25}
#dragGhost{position:absolute;z-index:60;pointer-events:none;font-size:38px;display:none;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
#actionrow{position:absolute;left:0;right:0;bottom:calc(96px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:10px;z-index:29;padding:0 16px;flex-wrap:wrap}
.pillbtn{background:var(--chrome);backdrop-filter:blur(6px);border-radius:999px;
  min-height:52px;padding:10px 18px;font-weight:700;color:var(--ink);
  box-shadow:0 2px 10px var(--soft);display:flex;align-items:center;gap:8px;font-size:.98em;
  transition:background 2s ease,color 2s ease}
.pillbtn:active{transform:scale(.95)}
.pillbtn .em{font-size:20px}

/* ---------- Startbildschirm ---------- */
#scr-start{z-index:20;align-items:center;justify-content:center;gap:18px;padding:24px}
#scr-start h1{font-size:2.1em;font-weight:800;letter-spacing:.14em;color:var(--ink);
  text-shadow:0 2px 14px rgba(255,255,255,.2)}
#profilecards{display:flex;gap:16px;width:100%;max-width:440px;justify-content:center}
.pcard{flex:1;max-width:210px;background:var(--card);border-radius:26px;padding:16px 12px 14px;
  display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--cardink);
  box-shadow:0 10px 30px rgba(10,14,30,.3);min-height:230px;justify-content:center}
.pcard:active{transform:scale(.97)}
.pcard .mini{width:120px;height:120px}
.pcard .pname{font-weight:800;font-size:1.15em}
.pcard .pstat{font-size:.82em;opacity:.7;text-align:center;min-height:2.2em}
.pcard.empty .pname{opacity:.55;font-weight:600;font-size:.95em}
#startextra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
#startextra .pillbtn{font-size:.9em}

/* ---------- Ritual ---------- */
#scr-ritual{z-index:22;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,#1b2547,#0b1020 75%)}
#ritualhint{position:absolute;bottom:14%;left:0;right:0;text-align:center;color:#cfd8f2;
  font-size:1.05em;opacity:.85;padding:0 30px;transition:opacity .8s}
#knospe{width:200px;height:220px;cursor:pointer;touch-action:none}
#knospe.shake{animation:kshake .5s ease}
@keyframes kshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scale(1.02)}75%{transform:rotate(3deg)}}
#sparks{position:absolute;inset:0;pointer-events:none}
.spark{position:absolute;width:64px;height:64px;border-radius:50%;cursor:pointer;
  pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
  animation:sfloat 4s ease-in-out infinite alternate}
.spark::before{content:'';width:26px;height:26px;border-radius:50%;background:var(--sc);
  box-shadow:0 0 22px 10px var(--sg)}
@keyframes sfloat{from{transform:translateY(0)}to{transform:translateY(-16px)}}
#namecard{max-width:340px}
#nameinput{width:100%;font-size:1.3em;padding:12px 14px;border-radius:14px;border:2px solid #d8d2c4;
  background:#fffdf6;text-align:center;font-weight:700;color:#33313d}
#nameinput:focus{outline:none;border-color:var(--accent,#5fa89a)}
.namerow{display:flex;gap:10px;margin-top:12px}
.namerow .bigbtn{margin-top:0}
#dicebtn{flex:0 0 64px;font-size:26px;background:#efe9da;color:#33313d}

/* ---------- Unterwegs-Szene ---------- */
#awayscene{position:absolute;inset:0;z-index:12;display:none}
#awayscene.on{display:block}
#awaypath{position:absolute;left:8%;right:8%;top:52%;height:80px}
#awaywalker{position:absolute;width:92px;height:92px;transition:left 1.2s linear;cursor:pointer}
#awaywalker svg{width:100%;height:100%}
#awaywalker .walkbob{animation:walkbob 1.6s ease-in-out infinite}
@keyframes walkbob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
#awayinfo{position:absolute;left:0;right:0;top:63%;text-align:center;color:var(--ink);pointer-events:none}
#awayinfo .big{font-weight:800;font-size:1.1em}
#awayinfo .sub{opacity:.75;font-size:.9em;margin-top:4px}

/* ---------- Bericht ---------- */
#reportcard .icons{font-size:34px;letter-spacing:8px;text-align:center;margin:8px 0 12px}
#reportcard .rtext{font-size:1.08em;line-height:1.6;font-family:Georgia,'Times New Roman',serif}
#reportcard .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip2{background:#efe9da;border-radius:999px;padding:6px 12px;font-size:.85em;font-weight:700}
#readbtn{margin-top:10px}

/* ---------- Senden ---------- */
.focusgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.focusbtn{border-radius:18px;background:#f2ecdd;padding:14px 8px;display:flex;flex-direction:column;
  align-items:center;gap:4px;min-height:84px;font-weight:700;font-size:.92em}
.focusbtn .em{font-size:32px}
.focusbtn.sel{background:var(--accent);color:#fff}
.taskrow{display:flex;gap:8px;margin-top:12px}
.taskbtn{flex:1;border-radius:16px;background:#f2ecdd;padding:10px 6px;text-align:center;
  font-size:.85em;font-weight:700;min-height:66px}
.taskbtn .em{font-size:22px;display:block}
.taskbtn.sel{background:var(--accent);color:#fff}
.taskbtn small{display:block;font-weight:600;opacity:.7;font-size:.85em}

/* ---------- Kampf ---------- */
#battlefield{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 4px;min-height:130px}
.fighter{width:120px;text-align:center}
.fighter .fsvg{width:110px;height:110px;margin:0 auto}
.fighter .femoji{font-size:64px;line-height:110px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.fighter.hit{animation:fhit .4s ease}
@keyframes fhit{0%,100%{transform:translateX(0)}30%{transform:translateX(-8px) rotate(-4deg)}60%{transform:translateX(5px)}}
.fighter.attack{animation:fatk .45s ease}
@keyframes fatk{0%,100%{transform:translateX(0)}40%{transform:translateX(26px) scale(1.06)}}
.fighter.enemy.attack{animation:fatkE .45s ease}
@keyframes fatkE{0%,100%{transform:translateX(0)}40%{transform:translateX(-26px) scale(1.06)}}
.hpbar{height:12px;border-radius:8px;background:#e3dccb;overflow:hidden;margin-top:6px}
.hpfill{height:100%;border-radius:8px;background:linear-gradient(90deg,#7cc96f,#a8dd8c);transition:width .5s ease}
.hpfill.low{background:linear-gradient(90deg,#e8a25a,#e8c25a)}
.fname{font-size:.85em;font-weight:800;margin-top:4px}
.elem{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:-4px;margin-left:4px;
  box-shadow:0 0 8px 2px var(--eg)}
#timingwrap{margin-top:10px;position:relative;height:64px;border-radius:16px;background:#efe9da;
  overflow:hidden;touch-action:manipulation}
#timingzone{position:absolute;top:0;bottom:0;background:rgba(124,201,111,.55);border-radius:8px}
#timingzone.gold{background:rgba(232,185,73,.65)}
#timingcursor{position:absolute;top:4px;bottom:4px;width:7px;border-radius:4px;background:#33313d}
#timinghint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:800;opacity:.5;font-size:.95em;pointer-events:none}
#battlemsg{text-align:center;min-height:2.6em;font-size:.95em;margin-top:8px;font-weight:600}

/* ---------- Minispiele ---------- */
#gamearea{position:relative;width:100%;height:min(62vh,520px);border-radius:20px;overflow:hidden;
  background:linear-gradient(var(--sky1),var(--sky2));touch-action:none}
.falling{position:absolute;font-size:36px;pointer-events:none;will-change:transform}
#gcatcher{position:absolute;bottom:6px;width:86px;height:86px;pointer-events:none;will-change:left}
#gcatcher svg{width:100%;height:100%}
.simonwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:26px;height:100%;align-content:center}
.simonstone{border-radius:26px;aspect-ratio:1.25;display:flex;align-items:center;justify-content:center;
  font-size:44px;background:var(--stc);opacity:.55;transition:opacity .18s,transform .18s;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.simonstone.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 26px 6px var(--stg),inset 0 -6px 0 rgba(0,0,0,.12)}
#rhywrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:26px}
#rhydrum{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff6e0,#e8c98a);
  box-shadow:0 8px 0 #c9a76a,0 12px 24px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;font-size:56px}
#rhydrum.beat{animation:drumbeat .22s ease}
@keyframes drumbeat{0%,100%{transform:scale(1)}40%{transform:scale(.9)}}
#gamehud{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-weight:700}
#gameresult{text-align:center}
#gameresult .rscore{font-size:2.4em;font-weight:800;margin:6px 0}
#gameresult .rbest{font-size:.9em;opacity:.7}

/* ---------- Evolution ---------- */
#ov-evo{background:rgba(6,8,18,.92)}
#evotext{color:#e8ecf6;font-size:1.25em;line-height:1.75;max-width:360px;text-align:center;
  font-family:Georgia,serif;min-height:7em}
#evostage{width:min(70vw,320px);aspect-ratio:1;position:relative}
#evostage .eold,#evostage .enew{position:absolute;inset:0;transition:opacity 2.2s ease,filter 2.2s ease}
#evostage .enew{opacity:0}
#evostage.morph .eold{opacity:0;filter:blur(8px) brightness(3)}
#evostage.morph .enew{opacity:1}
#evoflash{position:absolute;inset:0;background:radial-gradient(circle,#fff8e0,transparent 70%);
  opacity:0;pointer-events:none;transition:opacity 1.6s}
#evostage.morph #evoflash{animation:eflash 2.4s ease}
@keyframes eflash{0%{opacity:0}45%{opacity:.95}100%{opacity:0}}
#evocompare{display:flex;gap:16px;align-items:center;justify-content:center}
#evocompare .half{text-align:center}
#evocompare .half svg{width:120px;height:120px}
#evocompare .arrow{font-size:30px;color:#e8ecf6}

/* ---------- Hilfe ---------- */
#helptabs{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
.htab{width:64px;height:56px;border-radius:16px;background:#efe9da;display:flex;
  align-items:center;justify-content:center}
.htab svg{width:34px;height:34px}

function windowOf(t){
  const h=new Date(t).getHours();
  if(h>=6&&h<11)return 'morgen';

}

function windowId(t){
  const d=new Date(t), w=windowOf(t);
  if(w==='nacht'&&d.getHours()<6){const p=new Date(t-864e5);return dstr(p)+'-nacht'}
  return dstr(d)+'-'+w;
}
function windowEndMs(t){
  const d=new Date(t), h=d.getHours(), e=new Date(t);
  e.setMinutes(0,0,0);
  if(h>=6&&h<11)e.setHours(11); else if(h>=11&&h<17)e.setHours(17);
  else if(h>=17&&h<22)e.setHours(22);
  else if(h>=22){e.setHours(6);e.setTime(e.getTime()+864e5)} else e.setHours(6);
  return e.getTime();
}
function nextMorningMs(t){

/* ---------- Bedürfnisverfall ---------- */
function applyDecay(st,fromMs,toMs){
  let dt=(toMs-fromMs)/36e5; // Stunden
  if(dt<=0)return;
  dt=Math.min(dt,14); // Verfallsdeckel
  const n=st.needs, onTask=!!st.task, taskMul=onTask&&st.task.type!=='traum'?1.5:1;
  // stückweise pro Stunde, damit Nacht-Regeneration & Laune-Kopplung stimmen
  let t=fromMs; const step=36e5/4; let rest=dt*36e5;
  while(rest>0){
    const d=Math.min(step,rest)/36e5;
    const w=windowOf(t);
    n.satt=clamp(n.satt-4*d*taskMul,10,100);
    if(w==='nacht'&&(!st.task||st.task.type==='traum')) n.ausgeruht=clamp(n.ausgeruht+8*d,10,100);
    else n.ausgeruht=clamp(n.ausgeruht-3*d*taskMul,10,100);
    const lmul=(n.satt<30||n.ausgeruht<30)?2:1;
    n.laune=clamp(n.laune-2*d*lmul,10,100);
    n.sauber=clamp(n.sauber-2*d,10,100);
    t+=Math.min(step,rest);rest-=step;
  }
}

/* ---------- Offline-Berechnung beim Öffnen eines Profils ---------- */
function offlineCatchup(st){
  const t=nowMs(); const events=[];
  if(t<st.lastSeen){ st.lastSeen=t; return events; } // Uhr zurückgestellt: nichts gutschreiben
  const from=Math.max(st.lastSeen,t-14*36e5);
  applyDecay(st,from,t);
  // Aufgabe fertig?
  if(st.task&&t>=st.task.end){ events.push({typ:'bericht',task:st.task}); }
  // Fensterwechsel
  const wid=windowId(t);
  if(wid!==st.windowId){
    st.windowId=wid;
    st.beats=beatsMax(windowOf(t));
    st.care={fensterId:wid,beatSpent:false,pet:false,wash:0,geweckt:false,gekaempft:false,gespielt:false};
  }
  if(st.care.fensterId!==wid){st.care.fensterId=wid;}
  // Evolution am Morgen
  if(windowOf(t)==='morgen'&&st.stage<3){
    const need=st.stage===1?STUFE2_FENSTER:STUFE3_FENSTER;
    if(st.counters.fenster>=need) events.push({typ:'evolution'});
  }
  st.lastSeen=t;
  return events;
}

/* ---------- Effektive Werte ---------- */

  const n=st.needs,s=st.stats;

  };
}

    if(!S||!S.settings.sound)return; const c=ac(); if(!c)return;

    const t=c.currentTime+(when||0);

    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+0.05);
  }

/* ---------- Wesen-Controller (Hauptbühne) ---------- */
const Creature={
  elmt:null,lastPointer:null,blinkT:0,lookT:0,
  mount(){ this.elmt=$('#wesen'); this.render(); },
  render(){
    if(!S)return;
    const g=this.glowState();
    this.elmt.innerHTML=svgWesen({element:S.element,stage:S.stage,form:S.form,variant:S.variant,
      mood:this.mood(),glow:g.cls,glowOp:g.op,dirty:S.needs.sauber<35,sleeping:this.isSleeping()});
    this.elmt.classList.toggle('sleeping',this.isSleeping());
    this.elmt.classList.toggle('sad',this.mood()==='sad');
    this.elmt.classList.toggle('dirty',S.needs.sauber<35);
  },
  mood(){ return (S.needs.laune<32)?'sad':'happy'; },
  isSleeping(){
    if(S.wakePending)return true;
    const w=windowOf(nowMs());
    if(w==='nacht')return (S.task&&S.task.type==='traum')||S.beats<=0;
    return false;
  },
  glowState(){
    const n=S.needs;
    let cls='ruhig';
    if(n.satt<30)cls='flackern';
    else if(n.ausgeruht<30)cls='langsam';
    else if(n.sauber<30)cls='trueb';
    else if(n.laune>=70)cls='hell';
    return {cls,op:(0.4+0.6*n.laune/100).toFixed(2)};
  },
  refreshGlow(){
    if(!S)return;
    const g=this.glowState(), gl=this.elmt.querySelector('.glim');
    if(gl){gl.className.baseVal='glim glim-'+g.cls;gl.style.opacity=g.op;}
    this.elmt.classList.toggle('dirty',S.needs.sauber<35);
    const sv=this.elmt.querySelector('.wsvg');if(sv)sv.classList.toggle('isdirty',S.needs.sauber<35);
  },
  headFollow(x,y){
    const svg=this.elmt.querySelector('svg');if(!svg||this.isSleeping())return;
    const r=this.elmt.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height*0.38;
    const dx=clamp((x-cx)/r.width,-0.6,0.6), dy=clamp((y-cy)/r.height,-0.5,0.5);
    const hg=svg.querySelector('.headg');
    if(hg)hg.style.transform=`rotate(${(dx*10).toFixed(1)}deg) translate(${(dx*5).toFixed(1)}px,${(dy*3).toFixed(1)}px)`;
    const pu=svg.querySelector('.pupils');
    if(pu)pu.style.transform=`translate(${(dx*4.5).toFixed(1)}px,${(dy*3.5).toFixed(1)}px)`;
  },
  headRelax(){
    const svg=this.elmt.querySelector('svg');if(!svg)return;
    const hg=svg.querySelector('.headg'),pu=svg.querySelector('.pupils');
    if(hg)hg.style.transform='';if(pu)pu.style.transform='';
  },
  blink(){
    this.elmt.classList.add('blink');
    setTimeout(()=>this.elmt.classList.remove('blink'),140);
  },
  hop(){ this.elmt.classList.remove('happy-hop');void this.elmt.offsetWidth;this.elmt.classList.add('happy-hop'); },
  nuzzle(){ this.elmt.classList.remove('nuzzle');void this.elmt.offsetWidth;this.elmt.classList.add('nuzzle'); },
  tick(){
    if(!S||!$('#scr-home').classList.contains('on'))return;
    const t=Date.now();
    if(t>this.blinkT){ if(!this.isSleeping())this.blink(); this.blinkT=t+2200+Math.random()*3800; }
    if(this.lastPointer&&t-this.lastPointer>3000){
      this.headRelax();
      if(t>this.lookT){ // gelegentlich umschauen
        const svg=this.elmt.querySelector('svg'),hg=svg&&svg.querySelector('.headg');
        if(hg&&!this.isSleeping()){
          hg.style.transition='transform 1.1s ease';
          hg.style.transform=`rotate(${(Math.random()*14-7).toFixed(0)}deg)`;
          setTimeout(()=>{if(hg){hg.style.transform=''}},1600);
          setTimeout(()=>{if(hg){hg.style.transition=''}},2800);
        }
        this.lookT=t+5000+Math.random()*6000;
      }
    }
  },
};

/* ============================================================
   GESTEN: Streicheln, Waschen, Ziehen, Füttern — am Wesen selbst
   ============================================================ */
const gestCss=document.createElement('style');
gestCss.textContent=`#wesen{transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px)))}`;
document.head.appendChild(gestCss);

const Gestures={
  sess:null, foodDrag:null,
  init(){
    const stage=$('#stage');
    document.addEventListener('pointermove',e=>{
      if(UI.screen==='home'&&!UI.anyOverlay()&&S&&!S.task){Creature.lastPointer=Date.now();Creature.headFollow(e.clientX,e.clientY)}
      this.move(e);
    },{passive:true});
    document.addEventListener('pointerup',e=>this.up(e));
    document.addEventListener('pointercancel',e=>this.up(e));
    $('#wesen').addEventListener('pointerdown',e=>this.down(e));
    $('#drawer').addEventListener('pointerdown',e=>{
      const fi=e.target.closest('.fooditem');if(!fi)return;
      e.preventDefault();
      this.foodDrag={id:fi.dataset.food,elmt:fi,x:e.clientX,y:e.clientY,moved:false};
      const g=$('#dragGhost');g.textContent=fi.querySelector('span').textContent;
      g.style.display='block';this.ghostAt(e.clientX,e.clientY);
    });
    $('#awaywalker').addEventListener('pointerdown',e=>{
      UI.pop(e.clientX,e.clientY,'💛');Sound.stimme();vibr(15);
    });
  },
  ghostAt(x,y){const g=$('#dragGhost');g.style.left=(x-19)+'px';g.style.top=(y-24)+'px'},
  down(e){
    if(UI.anyOverlay()||!S||S.task)return;
    e.preventDefault();
    this.sess={x0:e.clientX,y0:e.clientY,lx:e.clientX,ly:e.clientY,t0:Date.now(),
      path:0,rev:0,lastSign:0,wind:0,petTicks:0,petAcc:0,mode:'unknown',washDone:false};
  },
  move(e){
    if(this.foodDrag){this.foodDrag.moved=true;this.ghostAt(e.clientX,e.clientY);return}
    const s=this.sess;if(!s)return;
    const dx=e.clientX-s.lx,dy=e.clientY-s.ly;
    s.path+=Math.hypot(dx,dy);
    const sign=dx>1?1:dx<-1?-1:0;
    if(sign&&s.lastSign&&sign!==s.lastSign)s.rev++;
    if(sign)s.lastSign=sign;
    // Winding um Wesenmitte (für Waschen) — nahe der Mitte nicht zählen,
    // sonst kippt ein gerader Zug durch die Mitte den Winkel um pi
    const r=$('#wesen').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    const r1=Math.hypot(s.lx-cx,s.ly-cy),r2=Math.hypot(e.clientX-cx,e.clientY-cy);
    if(r1>34&&r2>34){
      const a1=Math.atan2(s.ly-cy,s.lx-cx),a2=Math.atan2(e.clientY-cy,e.clientX-cx);
      let da=a2-a1;if(da>Math.PI)da-=2*Math.PI;if(da<-Math.PI)da+=2*Math.PI;
      s.wind+=da;
    }
    s.lx=e.clientX;s.ly=e.clientY;
    const disp=Math.hypot(e.clientX-s.x0,e.clientY-s.y0);
    if(s.mode==='unknown'&&disp>110&&s.rev<2&&Math.abs(s.wind)<1.2){s.mode='drag'}
    if(s.mode==='drag'){
      const w=$('#wesen');
      w.style.setProperty('--dx',clamp(e.clientX-s.x0,-160,160)+'px');
      w.style.setProperty('--dy',clamp((e.clientY-s.y0)*0.35,-40,40)+'px');
      return;
    }
    // Waschen: zwei volle Kreise
    if(!s.washDone&&Math.abs(s.wind)>2*2*Math.PI){
      s.washDone=true;s.mode='wash';Actions.wash(e.clientX,e.clientY);
    }
    // Streicheln: hin und her
    s.petAcc+=Math.hypot(dx,dy);
    if(s.rev>=1&&s.petAcc>85&&s.mode!=='wash'){
      s.petAcc=0;s.petTicks++;s.mode='pet';
      Actions.petTick(e.clientX,e.clientY,s.petTicks);
    }
    if(s.mode==='wash'&&Math.random()<0.3)UI.pop(e.clientX,e.clientY,'🫧');
  },
  up(e){
    if(this.foodDrag){
      const g=$('#dragGhost');g.style.display='none';
      const r=$('#wesen').getBoundingClientRect();
      const over=e.clientX>r.left-20&&e.clientX<r.right+20&&e.clientY>r.top-20&&e.clientY<r.bottom+30;
      if(this.foodDrag.moved&&over&&!$('#wesen').classList.contains('away'))Actions.feed(this.foodDrag.id);
      else if(!this.foodDrag.moved){ /* nur angetippt: kleiner Hinweis */
        if(!S.seen.futterHint){S.seen.futterHint=true;saveNow();UI.toast('Zieh das Futter zu '+S.name+' hoch.')}
      }
      this.foodDrag=null;return;
    }
    const s=this.sess;if(!s)return;this.sess=null;
    const w=$('#wesen');
    const disp=Math.hypot(e.clientX-s.x0,e.clientY-s.y0);
    if(s.mode==='drag'){
      w.style.setProperty('--dx','0px');w.style.setProperty('--dy','0px');
      if(Math.abs(e.clientX-s.x0)>130)Actions.openSend();
      return;
    }
    if(s.mode==='pet'){Actions.petEnd(s.petTicks);return}
    if(s.path<14&&Date.now()-s.t0<450)Actions.tap(e.clientX,e.clientY);
  },
};
/* ============================================================
   AKTIONEN: Füttern, Streicheln, Waschen, Wecken, Losschicken, Berichte
   ============================================================ */
const Actions={
  /* ---------- Antippen ---------- */
  tap(x,y){
    if(!S)return;
    if(S.wakePending||Creature.isSleeping()){this.wakeTap(x,y);return}
    Creature.hop();Sound.stimme();vibr(12);
    if(Math.random()<0.4)UI.pop(x,y-30,'💛');
  },
  wakeTapCount:0,
  wakeTap(x,y){

  /* ---------- Füttern ---------- */
  feed(foodId){

  /* ---------- Aufgabe fertig → Bericht ---------- */
  completeTask(task){
    const isTraum=task.type==='traum';
    const lenF={streifzug:1,sammelgang:2.5,wanderung:4,traum:4}[task.type]||1;
    const gains={},loot={};
    const add=(k,v)=>{gains[k]=(gains[k]||0)+v};
    if(isTraum){
      add('klugheit',Math.round(3+Math.random()*2));
    } else {
      if(task.focus==='training'){add('kraft',Math.round(lenF*(1+Math.random())));add('tempo',Math.round(lenF*0.6))}
      if(task.focus==='erkunden'){add('klugheit',Math.round(lenF*(0.8+Math.random()*0.7)))}
      if(task.focus==='ruhe'){S.needs.ausgeruht=clamp(S.needs.ausgeruht+10+lenF*5,10,100);S.needs.laune=clamp(S.needs.laune+8,10,100);add('herz',Math.round(lenF*0.5))}
      if(task.focus==='essen'){S.needs.satt=clamp(S.needs.satt+8,10,100)}
      const nLoot=task.focus==='essen'?2+Math.round(Math.random()*2):(Math.random()<0.7?1:0);
      const rareOk=(task.type==='wanderung'||task.focus==='erkunden');
      for(let i=0;i<nLoot;i++){
        const pool=DATA.welt.futter.filter(f=>f.selten?(rareOk&&Math.random()<0.35):true);
        const f=rnd(pool.length?pool:DATA.welt.futter);
        loot[f.id]=(loot[f.id]||0)+1;
      }
      Object.entries(loot).forEach(([id,n])=>{S.inventory[id]=(S.inventory[id]||0)+n});
    }
    Object.entries(gains).forEach(([k,v])=>{S.stats[k]+=v});
    const rep=this.buildReport(task,gains,loot,isTraum);
    S.log.unshift(rep);S.log=S.log.slice(0,20);
    S.task=null;
    return rep;
  },
  buildReport(task,gains,loot,isTraum){
    const B=DATA.berichte,mc=DATA.welt.microcopy;
    let text='',icons=[],title='';
    if(isTraum){
      title=rnd(mc.traum_titel);
      const frags=[];const pool=[...DATA.traeume.traumfragmente];
      for(let i=0;i<2&&pool.length;i++){const f=pool.splice(Math.floor(Math.random()*pool.length),1)[0];frags.push(f)}
      text=frags.map(f=>f.satz).join(' ')+' '+rnd(DATA.traeume.traumschluss).satz;
      icons=['🌙',...frags.map(f=>f.emoji)];
    } else {
      title=rnd(mc.rueckkehr_titel);
      const wz=windowOf(task.start);
      const recent=S.log.slice(0,6).flatMap(r=>r.ids||[]);
      const orte=B.orte.filter(o=>o.tageszeit.includes(wz)&&!recent.includes(o.id));
      const ort=rnd(orte.length?orte:B.orte);
      const evs=B.ereignisse.filter(e=>e.tageszeit.includes(wz)&&e.fokus.includes(task.focus)&&!recent.includes(e.id));
      const evPool=evs.length?evs:B.ereignisse.filter(e=>e.tageszeit.includes(wz));
      const ev1=rnd(evPool.length?evPool:B.ereignisse);
      let parts=[ort.satz,ev1.satz];icons=[ort.emoji,ev1.emoji];
      let ids=[ort.id,ev1.id];
      if(task.type!=='streifzug'&&Math.random()<0.75){
        const p2=evPool.filter(e=>e.id!==ev1.id);
        if(p2.length){const ev2=rnd(p2);parts.push(ev2.satz);icons.push(ev2.emoji);ids.push(ev2.id)}
      }
      const lootIds=Object.keys(loot);
      if(lootIds.length){
        const f=DATA.welt.futter.find(x=>x.id===lootIds[0]);
        parts.push(fundSatz(f,loot[lootIds[0]]));
        icons.push(f.emoji);
      }
      // seltenes Ereignis
      const unseenRare=B.selten.filter(r=>!S.seenRare.includes(r.id));
      if(unseenRare.length&&(task.type==='wanderung'||task.focus==='erkunden')&&Math.random()<0.3){
        const r=rnd(unseenRare);S.seenRare.push(r.id);
        parts.push(r.satz);icons.push(r.emoji);
      }
      const schl=B.schluss.filter(s=>!s.fokus||!s.fokus.length||s.fokus.includes(task.focus));
      parts.push(rnd(schl.length?schl:B.schluss).satz);
      text=parts.join(' ');
      this._lastIds=ids;
    }
    return {t:nowMs(),typ:isTraum?'traum':task.type,title,text,icons:icons.slice(0,4),
      gains,loot,ids:this._lastIds||[]};
  },
  showReport(rep){
    S.pendingReport=null;
    $('#toast').classList.remove('on');
    $('#reporttitle').textContent=rep.title;
    $('#reporticons').textContent=rep.icons.join(' ');
    $('#reporttext').textContent=rep.text;
    const ch=$('#reportchips');ch.innerHTML='';
    Object.entries(rep.gains||{}).forEach(([k,v])=>{if(v>0)ch.appendChild(el('span','chip2',`${STATEM[k]} +${v} ${STATNAMES[k]}`))});
    Object.entries(rep.loot||{}).forEach(([id,n])=>{
      const f=DATA.welt.futter.find(x=>x.id===id);
      if(f)ch.appendChild(el('span','chip2',`${f.emoji} ${n}× ${f.name}`));
    });
    if(S.stage<2)ch.querySelectorAll('.chip2').forEach((c,i)=>{if(c.textContent.includes('+'))c.style.display='none'});
    $('#readbtn').style.display=('speechSynthesis' in window)?'block':'none';
    UI.overlay('ov-report');
    saveNow();UI.refreshHome();
  },
  readAloud(){
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance($('#reporttext').textContent);
      u.lang='de-DE';u.rate=0.92;u.pitch=1.25;

  },
};

const Away={
  refresh(){

/* ---------- Minispiele ---------- */
const Games={
  current:null,raf:0,
  open(){
    if(S.beats<=0){UI.ruheStatus();UI.toast('Keine Herzschläge mehr übrig.');return}
    const list=S.stage>=2?['beeren','echo','rhythmus']:['beeren'];

      b.onclick=()=>this.start(id);gb.appendChild(b);
    });

  start(id){
    if(!spendBeat())return;

    if(id==='rhythmus')this.rhythmus();
  },
  end(id,score,best,line,statGain){
    cancelAnimationFrame(this.raf);
    const prevBest=S.highs[id]||0,isBest=score>prevBest;
    if(isBest)S.highs[id]=score;
    const g=statGain.stat;

      <div class="rbest">${zeroCase?'':(isBest?'Neue Bestleistung! ✨':'Bestleistung: '+(S.highs[id]||0))}</div>
      ${S.stage>=2?`<div class="chip2" style="display:inline-block;margin-top:8px">${STATEM[g]} +${statGain.v} ${STATNAMES[g]}</div>`:''}
    </div>`;
    $('#gamehud').innerHTML='';

  /* --- Beerenfang --- */
  beeren(){
    $('#gametitle').textContent='Beerenfang';
    const area=$('#gamearea');
    area.innerHTML=`<div id="gcatcher">${svgWesen({element:S.element,stage:S.stage,form:S.form,variant:S.variant,glow:'hell',glowOp:1})}</div>`;
    const cat=$('#gcatcher');
    let cx=area.clientWidth/2,target=cx,caught=0,missed=0,spawned=0,items=[],t0=performance.now(),last=t0;
    const total=18, good=['🫐','🍓','🍇','🌰'],bad=['🍂','🪨'];
    const speedLerp=0.06+0.10*clamp(effStats(S).tempo/60,0,1);
    area.addEventListener('pointermove',e=>{const r=area.getBoundingClientRect();target=e.clientX-r.left},{passive:true});
    area.addEventListener('pointerdown',e=>{const r=area.getBoundingClientRect();target=e.clientX-r.left},{passive:true});
    const hud=$('#gamehud');
    const loop=(t)=>{
      const dt=Math.min(40,t-last);last=t;
      cx+=(target-cx)*speedLerp*(dt/16);
      cx=clamp(cx,40,area.clientWidth-40);
      cat.style.left=(cx-43)+'px';
      if(spawned<total&&Math.random()<0.028*(dt/16)){
        spawned++;
        const isGood=Math.random()<0.72;
        const d=el('div','falling',isGood?rnd(good):rnd(bad));
        d.dataset.good=isGood?'1':'';
        d.dataset.x=40+Math.random()*(area.clientWidth-80);
        d.dataset.y=-30;d.dataset.v=1.9+Math.random()*1.4+spawned*0.05;
        d.style.transform=`translate(${d.dataset.x}px,-30px)`;
        area.appendChild(d);items.push(d);
      }
      items=items.filter(d=>{
        let y=parseFloat(d.dataset.y)+parseFloat(d.dataset.v)*(dt/16);
        d.dataset.y=y;
        d.style.transform=`translate(${d.dataset.x}px,${y}px)`;
        const catchY=area.clientHeight-92;
        if(y>catchY&&y<catchY+56&&Math.abs(parseFloat(d.dataset.x)+18-cx)<46){
          if(d.dataset.good){caught++;UI.sparkleAt0(area,d);Sound.plink();vibr(10)}
          else{missed++;Sound.tief();cat.style.filter='grayscale(.6)';setTimeout(()=>cat.style.filter='',420)}
          d.remove();return false;
        }
        if(y>area.clientHeight){d.remove();return false}
        return true;
      });
      hud.textContent='🫐 '+caught;
      if(spawned>=total&&!items.length){
        this.end('beeren',caught,0,'Gefangen:',{stat:'tempo',v:Math.max(1,Math.round(caught/4)),em:'🫐'});
        return;
      }
      this.raf=requestAnimationFrame(loop);
    };
    UI.sparkleAt0=(area,d)=>{const r=area.getBoundingClientRect();UI.pop(r.left+parseFloat(d.dataset.x)+14,r.top+parseFloat(d.dataset.y),'✨')};
    this.raf=requestAnimationFrame(loop);
  },

  /* --- Echofolge (Simon) --- */
  echo(){
    $('#gametitle').textContent='Echofolge';
    const area=$('#gamearea');
    const stones=[{c:'#e8756d',s:'●'},{c:'#e8b931',s:'▲'},{c:'#6fb3a8',s:'■'},{c:'#9a8fe8',s:'✦'}];
    area.innerHTML='<div class="simonwrap">'+stones.map((st,i)=>
      `<button class="simonstone" data-i="${i}" style="--stc:${st.c};--stg:${st.c}">${st.s}</button>`).join('')+'</div>';
    const btns=[...area.querySelectorAll('.simonstone')];
    const seq=[];let inputPos=0,playing=true,round=0;
    const showMs=620+380*clamp(effStats(S).klugheit/60,0,1);
    const tones=[392,494,587,740];
    const lit=(i,ms)=>{btns[i].classList.add('lit');
      if(S.settings.sound){Sound.plink()}
      setTimeout(()=>btns[i].classList.remove('lit'),ms||showMs*0.6)};
    const playSeq=async()=>{
      playing=true;$('#gamehud').textContent='Schau gut hin … Runde '+(round+1);
      await new Promise(r=>setTimeout(r,800));
      for(const i of seq){lit(i);await new Promise(r=>setTimeout(r,showMs))}
      playing=false;inputPos=0;$('#gamehud').textContent='Jetzt du.';
    };
    const next=()=>{seq.push(Math.floor(Math.random()*4));round++;playSeq()};
    btns.forEach(b=>b.onclick=()=>{
      if(playing)return;
      const i=+b.dataset.i;lit(i,260);vibr(10);
      if(i===seq[inputPos]){inputPos++;
        if(inputPos>=seq.length){
          if(round>=8){this.end('echo',round,0,'Runden geschafft:',{stat:'klugheit',v:Math.max(1,Math.round(round/2)),em:'🪨'});return}
          setTimeout(next,700);
        }
      } else {
        this.end('echo',round-1<0?0:round-1,0,'Runden geschafft:',{stat:'klugheit',v:Math.max(1,Math.round(round/2)),em:'🪨'});
      }
    });
    next();
  },

  /* --- Rhythmusklopfen --- */
  rhythmus(){
    $('#gametitle').textContent='Rhythmusklopfen';
    const area=$('#gamearea');
    area.innerHTML=`<div id="rhywrap"><div id="rhydrum">🥁</div><div id="rhymsg" style="font-weight:700;min-height:1.6em"></div></div>`;
    const drum=$('#rhydrum'),msg=$('#rhymsg');
    const tol=300+220*clamp(effStats(S).herz/60,0,1);
    let score=0,roundN=0,expect=[],taps=[],listening=false;
    const patterns=[[0,500,1000],[0,400,800,1200],[0,300,600,1200],[0,350,700,1050,1400]];
    const beat=()=>{drum.classList.remove('beat');void drum.offsetWidth;drum.classList.add('beat');Sound.trommel();vibr(20)};
    const playRound=async()=>{
      roundN++;
      if(roundN>4){this.end('rhythmus',score,0,'Im Takt getroffen:',{stat:'herz',v:Math.max(1,Math.round(score/3)),em:'🥁'});return}
      const pat=patterns[Math.min(roundN-1,patterns.length-1)];
      msg.textContent='Hör zu …';listening=false;
      await new Promise(r=>setTimeout(r,900));
      const t0=performance.now();
      for(const p of pat){setTimeout(beat,p)}
      await new Promise(r=>setTimeout(r,pat[pat.length-1]+600));
      msg.textContent='Jetzt du. Klopf mit.';
      expect=pat;taps=[];listening=true;
      const start=performance.now();
      const check=setInterval(()=>{
        if(performance.now()-start>pat[pat.length-1]+1800){
          clearInterval(check);listening=false;
          let hit=0;
          expect.forEach(pt=>{if(taps.some(tp=>Math.abs(tp-pt)<tol))hit++});
          score+=hit;
          msg.textContent=hit===expect.length?'Genau richtig. ✨':hit>0?'Fast. Weiter geht’s.':'Macht nichts. Nochmal.';
          Sound.freude();
          setTimeout(playRound,1100);
        }
      },120);
      area.onpointerdown=()=>{if(!listening)return;
        taps.push(performance.now()-start);beat();};
    };
    playRound();
  },
};
/* ============================================================
   KAMPF & FREUNDESCODE
   ============================================================ */
const B36='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
const ELIDX=['glut','tau','moos','funke'];
const FORMIDX=[null,'wehr','flink','traum','herz'];
function b36(n,len){n=clamp(Math.round(n),0,Math.pow(36,len)-1);let s='';
  do{s=B36[n%36]+s;n=Math.floor(n/36)}while(n>0);return s.padStart(len,'0')}
function encodeCode(st){
  let d='G1'+b36(ELIDX.indexOf(st.element),1)+b36(st.stage,1)+b36(Math.max(0,FORMIDX.indexOf(st.form)),1)
    +b36(st.stats.kraft,2)+b36(st.stats.tempo,2)+b36(st.stats.klugheit,2)+b36(st.stats.herz,2);
  let sum=0;for(const c of d)sum+=B36.indexOf(c)>=0?B36.indexOf(c):0;
  d+=B36[sum%36];
  const nm=(st.name||'').toUpperCase().replace(/[^A-ZÄÖÜ]/g,'').slice(0,8);
  return d+(nm?'-'+nm:'');
}
function decodeCode(raw){
  const s=(raw||'').trim().toUpperCase();
  const m=s.match(/^G1([0-9A-Z]{12})(?:-([A-ZÄÖÜ]{1,8}))?$/);
  if(!m)return null;
  const d='G1'+m[1];
  let sum=0;for(const c of d.slice(0,-1))sum+=B36.indexOf(c);
  if(B36[sum%36]!==d[d.length-1])return null;
  const q=m[1].slice(0,11); // letztes Zeichen ist die Prüfsumme
  const v=(i,l)=>parseInt(q.slice(i,i+l),36);
  const st={element:ELIDX[v(0,1)]||'glut',stage:clamp(v(1,1),1,3),form:FORMIDX[v(2,1)]||null,
    stats:{kraft:v(3,2),tempo:v(5,2),klugheit:v(7,2),herz:v(9,2)},name:m[2]||'Fremdes Wesen'};
  if(st.stage<2)st.form=null;
  return st;
}

function elemMult(a,b){ if(KONTER[a]===b)return 1.4; if(KONTER[b]===a)return 0.7; return 1; }

    me.style.width=this.st.myHp+'%';en.style.width=this.st.enHp+'%';
    me.classList.toggle('low',this.st.myHp<35);en.classList.toggle('low',this.st.enHp<35);
  },
  startRound(){
    const st=this.st;st.phase='timing';st.round++;
    $('#battlebtns').innerHTML='';
    $('#battlemsg').textContent='Runde '+st.round+' — tipp im richtigen Moment!';
    $('#timingwrap').style.visibility='visible';
    // grüne Zone: Breite nach Tempo
    const zoneW=18+10*clamp(effStats(S).tempo/60,0,1);
    const zoneX=15+Math.random()*(70-zoneW);
    st.zone={x:zoneX,w:zoneW};
    const z=$('#timingzone');z.style.left=zoneX+'%';z.style.width=zoneW+'%';z.classList.remove('gold');
    st.cursor=0;st.dir=1;st.await=true;
    const wrap=$('#timingwrap');
    let last=performance.now();
    const speed=0.10+0.02*st.round;
    const loop=(t)=>{
      if(!st.await)return;
      const dt=t-last;last=t;
      st.cursor+=st.dir*speed*dt;
      if(st.cursor>=97){st.cursor=97;st.dir=-1}
      if(st.cursor<=0){st.cursor=0;st.dir=1}
      $('#timingcursor').style.left=st.cursor+'%';
      st.raf=requestAnimationFrame(loop);
    };
    st.raf=requestAnimationFrame(loop);
    wrap.onpointerdown=()=>{ if(!st.await)return; st.await=false;cancelAnimationFrame(st.raf);this.resolveRound() };
    // auch ohne Tipp geht es weiter (der Zeiger pendelt max 6s)
    st.timeout=setTimeout(()=>{if(st.await){st.await=false;cancelAnimationFrame(st.raf);this.resolveRound(true)}},6000);
  },
  resolveRound(auto){
    const st=this.st;clearTimeout(st.timeout);
    const c=st.cursor,z=st.zone;
    const inZone=!auto&&c>=z.x&&c<=z.x+z.w;
    const center=inZone&&Math.abs(c-(z.x+z.w/2))<z.w*0.18;
    const quality=auto?0.55:inZone?(center?1.3:1):0.6;
    if(inZone){$('#timingzone').classList.add('gold');Sound.treffer();vibr(25)}
    const eff=effStats(S),en=st.enemy;
    const myDmg=(12+eff.kraft*0.5)*quality*elemMult(S.element,en.element);
    const enDmg=(8+en.power*0.35)*(0.75+Math.random()*0.4)*elemMult(en.element,S.element);
    const meF=$('.fighter.me'),enF=$('.fighter.enemy');
    meF.classList.add('attack');
    setTimeout(()=>{meF.classList.remove('attack');enF.classList.add('hit');
      st.enHp=clamp(st.enHp-myDmg,0,100);this.hp();
      setTimeout(()=>enF.classList.remove('hit'),420);
    },240);
    $('#battlemsg').textContent=center?'Mitten ins Grüne! Voller Treffer!':inZone?'Getroffen!':'Knapp daneben — ein bisschen Schaden trotzdem.';
    setTimeout(()=>{
      if(st.enHp<=0){this.finish(true);return}
      enF.classList.add('attack');
      setTimeout(()=>{enF.classList.remove('attack');meF.classList.add('hit');
        st.myHp=clamp(st.myHp-enDmg,0,100);this.hp();
        setTimeout(()=>meF.classList.remove('hit'),420);
        setTimeout(()=>{
          if(st.myHp<=0){this.finish(false)}
          else if(st.round>=st.maxRounds){this.finish(st.myHp>=st.enHp)}
          else this.startRound();
        },600);
      },240);
    },1100);
  },
  finish(won){
    const st=this.st;st.phase='done';
    $('#timingwrap').style.visibility='hidden';
    const bb=$('#battlebtns');bb.innerHTML='';
    if(won){
      S.counters.siege++;
      const g=2+Math.round(Math.random()*2);S.stats.kraft+=g;
      S.needs.laune=clamp(S.needs.laune+8,10,100);
      $('#battlemsg').textContent=st.enemy.sieg+' '+rnd(DATA.welt.microcopy.kampf_sieg);
      const me=$('.fighter.me');me.classList.add('attack');Sound.freude();vibr([30,50,30]);
      if(S.stage>=2)$('#battlemsg').textContent+=' (💪 +'+g+' Kraft)';
    } else {
      S.needs.laune=clamp(S.needs.laune-10,10,100);
      $('#battlemsg').textContent=st.enemy.niederlage+' '+rnd(DATA.welt.microcopy.kampf_trost).replace('{name}',S.name);
      Sound.tief();
    }
    S.needs.sauber=clamp(S.needs.sauber-12,10,100);
    saveNow();
    const ok=el('button','bigbtn',won?'Juhu!':'Trösten 💛');
    ok.onclick=()=>{UI.overlay('ov-battle',false);Creature.render();UI.refreshHome();
      if(!won){Creature.nuzzle();UI.toast('Streichel '+S.name+' ein bisschen.')}};
    bb.appendChild(ok);
  },
};

   EVOLUTION — der kausale Reveal

const Evo={
  pickForm(){
    const c=S.counters,s=S.stats;
    const maxC=Math.max(1,c.kaempfe,c.spiele,c.traeume,c.streicheln);
    const maxS=Math.max(1,s.kraft,s.tempo,s.klugheit,s.herz);
    const score={
      wehr:2*c.kaempfe/maxC+s.kraft/maxS,
      flink:2*c.spiele/maxC+s.tempo/maxS,
      traum:2*c.traeume/maxC+s.klugheit/maxS,
      herz:2*c.streicheln/maxC+s.herz/maxS,
    };
    return Object.entries(score).sort((a,b)=>b[1]-a[1])[0][0];
  },
  domCount(form){
    const c=S.counters;
    return {wehr:c.kaempfe,flink:c.spiele,traum:c.traeume,herz:c.streicheln}[form]||0;
  },
  ready(){
    if(!S||S.stage>=3)return false;
    if(windowOf(nowMs())!=='morgen')return false;
    return S.counters.fenster>=(S.stage===1?STUFE2_FENSTER:STUFE3_FENSTER);
  },
  run(done){
    const newStage=S.stage+1;
    const form=newStage===2?this.pickForm():S.form;
    const variant=newStage===3?((S.element==='glut'||S.element==='funke')?'hell':'still'):null;
    const rs=DATA.traeume.rueckschau.find(r=>r.form===form&&r.stufe===newStage);
    const text=(rs?rs.text:'Etwas hat sich verändert.')
      .replace(/\{name\}/g,S.name).replace(/\{n\}/g,String(Math.max(2,this.domCount(form))));
    const oldOpts={element:S.element,stage:S.stage,form:S.form,variant:S.variant,glow:'hell',glowOp:1};
    const newOpts={element:S.element,stage:newStage,form,variant,glow:'hell',glowOp:1};
    const ov=$('#ov-evo'),tx=$('#evotext'),st=$('#evostage'),cp=$('#evocompare'),btn=$('#evonext');
    tx.textContent='';tx.classList.remove('hidden');
    st.classList.add('hidden');st.classList.remove('morph');
    cp.classList.add('hidden');cp.innerHTML='';
    UI.overlay('ov-evo');
    let phase=0;
    // Schreibmaschinen-Text
    let i=0;btn.style.visibility='hidden';
    const type=()=>{ if(i<=text.length){tx.textContent=text.slice(0,i);i+=2;setTimeout(type,34)} else btn.style.visibility='visible'; };
    setTimeout(type,600);
    btn.onclick=()=>{
      if(phase===0){
        phase=1;tx.classList.add('hidden');btn.style.visibility='hidden';
        st.classList.remove('hidden');
        st.querySelector('.eold').innerHTML=svgWesen(oldOpts);
        st.querySelector('.enew').innerHTML=svgWesen(newOpts);
        Sound.freude();
        setTimeout(()=>{st.classList.add('morph');vibr([40,80,40,80,120]);},700);
        setTimeout(()=>{btn.style.visibility='visible';btn.textContent='Weiter'},3400);
      } else if(phase===1){
        phase=2;st.classList.add('hidden');
        cp.classList.remove('hidden');
        cp.innerHTML=`<div class="half">${svgWesen(oldOpts)}<div style="color:#cfd8f2;font-size:.85em">vorher</div></div>
          <div class="arrow">→</div>
          <div class="half">${svgWesen(newOpts)}<div style="color:#fff;font-weight:800">${FORMNAME(form,newStage)}</div></div>`;
        btn.textContent='Hallo, '+S.name;
      } else {
        // Zustand festschreiben
        S.stage=newStage;S.form=form;S.variant=variant;
        S.chronicle.push({t:nowMs(),stage:newStage,form,text});
        if(newStage===2&&!S.seen.stage2){S.seen.stage2=true;
          setTimeout(()=>UI.toast('Neu: Kämpfe am Abend, Spiele, Werte und der Freundescode unter „Mehr“.',4200),1200)}
        if(newStage===3&&!S.seen.stage3){S.seen.stage3=true;
          setTimeout(()=>UI.toast('Neu: Statistik in „Mehr“.',3200),1200)}
        saveNow();
        UI.overlay('ov-evo',false);
        Creature.render();Creature.hop();UI.refreshHome();
        btn.textContent='Weiter';
        if(done)done();
      }
    };
  },
};

const Ritual={
  pid:null,taps:0,element:null,
  start(pid){
    this.pid=pid;this.taps=0;this.element=null;
    $('#knospe').innerHTML=svgKnospe('#8fa8d8','rit');
    $('#sparks').innerHTML='';

    UI.show('ritual');
    const k=$('#knospe');
    k.onpointerdown=()=>this.tapKnospe();
  },
  tapKnospe(){
    if(this.taps>=4)return;
    this.taps++;
    const k=$('#knospe');
    k.classList.remove('shake');void k.offsetWidth;k.classList.add('shake');
    Sound.tief();vibr(20);
    const g=k.querySelector('.glim');
    if(g)g.style.transform='scale('+(1+this.taps*0.3)+')';
    if(this.taps===2)$('#ritualhint').textContent='Es regt sich. Weiter.';
    if(this.taps>=4){
      $('#ritualhint').textContent='Vier Funken kommen. Wisch einen in die Knospe.';
      setTimeout(()=>this.spawnSparks(),500);
    }
  },
  spawnSparks(){
    const wrap=$('#sparks');wrap.innerHTML='';
    const pos=[[14,22],[70,16],[10,58],[74,54]];
    Object.keys(ELEMENTS).forEach((elId,i)=>{
      const E=ELEMENTS[elId];
      const s=el('div','spark');
      s.style.setProperty('--sc',E.farbe);s.style.setProperty('--sg',E.glow);
      s.style.left=pos[i][0]+'%';s.style.top=pos[i][1]+'%';
      s.style.animationDelay=(i*0.6)+'s';
      s.dataset.el=elId;
      s.addEventListener('pointerdown',ev=>this.dragSpark(ev,s,elId));
      wrap.appendChild(s);
    });
  },
  dragSpark(ev,s,elId){
    ev.preventDefault();
    s.style.animation='none';s.style.zIndex=10;
    const move=e=>{s.style.left=(e.clientX-32)+'px';s.style.top=(e.clientY-32)+'px'};
    const up=e=>{
      document.removeEventListener('pointermove',move);
      document.removeEventListener('pointerup',up);
      const k=$('#knospe').getBoundingClientRect();
      const inside=e.clientX>k.left-30&&e.clientX<k.right+30&&e.clientY>k.top-30&&e.clientY<k.bottom+30;
      if(inside)this.chose(elId);
      else{s.style.left='';s.style.top='';s.style.zIndex='';s.style.animation='';
        // Positionen wiederherstellen
        this.spawnSparks();}
    };
    document.addEventListener('pointermove',move);
    document.addEventListener('pointerup',up);
  },
  chose(elId){
    this.element=elId;
    $('#sparks').innerHTML='';
    const k=$('#knospe');
    k.innerHTML=svgKnospe(ELEMENTS[elId].farbe,'rit2');
    const g=k.querySelector('.glim');
    if(g){g.style.transform='scale(2.2)';g.classList.remove('glim-ruhig');g.classList.add('glim-hell')}
    Sound.freude();vibr([30,60,30]);
    $('#ritualhint').textContent='Da drin leuchtet es jetzt.';
    setTimeout(()=>{
      $('#nameinput').value='';
      UI.overlay('ov-name');
      setTimeout(()=>{try{$('#nameinput').focus()}catch(e){}},300);
    },1400);
  },
  finish(name){
    const st=newState(name,this.element);
    st.pref=rnd(DATA.welt.futter.filter(f=>!f.selten)).id;
    save(this.pid,st);
    meta.profiles[this.pid]=name;saveMeta();
    UI.overlay('ov-name',false);
    Boot.enter(this.pid,true);
  },
};

        .map(([g,w])=>`<div class="gr">${svgWesen({element:elmt,stage:1,glow:g,glowOp:g==='hell'?1:.7})}<div>${w}</div></div>`).join('')+'</div>';
      case 'treffen':return '<div style="display:flex;justify-content:center;gap:0;height:100%;align-items:center">'+
        `<div style="width:80px">${svgWesen({element:'glut',stage:1,glow:'hell',glowOp:1})}</div>`+
        '<div style="font-size:26px">💛</div>'+
        `<div style="width:80px">${svgWesen({element:'tau',stage:1,glow:'hell',glowOp:1})}</div></div>`;
    }
    return mini();
  },
  bild(body){
    DATA.welt.bildhilfe.forEach(h=>{
      const c=el('div','helpcard');
      c.innerHTML=`<div class="demo">${this.demo(h.id)}</div><h3>${h.titel}</h3><p>${h.satz}</p>`;
      body.appendChild(c);
    });
  },
  text(body){
    DATA.welt.texthilfe.forEach(h=>{
      const d=el('details','hsec');
      d.innerHTML=`<summary>${h.titel}</summary><div class="htxt">${h.text}</div>`;
      body.appendChild(d);
    });
  },
};

/* ---------- Mehr-Menü ---------- */
const Menu={

      const items=[];

      items.push(['sichern','🗝️ Sichern & Laden']);
      items.forEach(([id,label])=>{const bb=el('button','bigbtn ghost',label);bb.onclick=()=>this.open(id,this.fromStart);b.appendChild(bb)});
    }
    else if(view==='werte'){
      t.textContent='Werte';

      t.textContent='Freundescode';

      const code=encodeCode(S);

      b.appendChild(el('p','','<br><b>Code von einem Freund?</b>'));

      b.appendChild(inp);
      const go=el('button','bigbtn','Gegen den Freund kämpfen');
      go.onclick=()=>Battle.openCode(inp.value);
      b.appendChild(go);
      const other=P==='p1'?'p2':'p1';
      const os=loadProfile(other);
      if(os){const sib=el('button','bigbtn ghost','⚔️ Gegen '+os.name+' kämpfen');
        sib.onclick=()=>Battle.openSibling(other);b.appendChild(sib)}
      back();
    }
    else if(view==='statistik'){
      t.textContent='Statistik';
      const c=S.counters;
      const d=new Date(S.born);
      b.innerHTML+=`<div class="chronentry">Geboren am ${d.toLocaleDateString('de-DE')}<br>
        Erlebte Tageszeiten: <b>${c.fenster}</b><br>Kämpfe: <b>${c.kaempfe}</b> (davon gewonnen: ${c.siege})<br>
        Traumreisen: <b>${c.traeume}</b><br>Spiele gespielt: <b>${c.spiele}</b><br>
        Mahlzeiten: <b>${c.fuetterungen}</b><br>Gestreichelt: <b>${c.streicheln}</b>× ausgiebig<br>
        Gebadet: <b>${c.gewaschen}</b>×</div>`;
      back();

    else if(view==='sichern'){
      t.textContent='Sichern & Laden';
      b.appendChild(el('p','','Damit nichts verloren geht: Kopiere dir diesen Text irgendwohin (Notiz, Nachricht an dich selbst). Mit „Laden“ holst du alles zurück — auch auf einem neuen Gerät.'));
      const ta=el('textarea','');ta.style.cssText='width:100%;height:90px;font-size:11px;border-radius:12px;border:2px solid #d8d2c4;padding:8px;background:#fffdf6;color:#33313d';
      const dump={meta,p1:loadProfile('p1'),p2:loadProfile('p2')};

      ta.onclick=()=>ta.select();
      b.appendChild(ta);
      const cp=el('button','bigbtn ghost','Alles kopieren');
      cp.onclick=()=>{try{navigator.clipboard.writeText(ta.value);UI.toast('Kopiert. Füg es irgendwo Sicherem ein.')}catch(e){ta.select();UI.toast('Markiert — jetzt kopieren.')}};
      b.appendChild(cp);
      b.appendChild(el('p','','<br><b>Sicherung laden</b> (ersetzt den aktuellen Stand):'));
      const ta2=el('textarea','');ta2.placeholder='Hier die gesicherte Zeile einfügen …';
      ta2.style.cssText=ta.style.cssText;
      b.appendChild(ta2);
      const ld=el('button','bigbtn','Laden');
      ld.onclick=()=>{
        try{
          const d=JSON.parse(ta2.value);
          if(!d||typeof d!=='object'||!('meta' in d))throw 0;
          if(d.p1)store.set('glimm.p1',d.p1);
          if(d.p2)store.set('glimm.p2',d.p2);

/* ---------- Treffen: beide Glimmlinge spielen zusammen ---------- */
const Treffen={
  open(){
    const s1=loadProfile('p1'),s2=loadProfile('p2');
    if(!s1||!s2)return;
    const st=$('#treffenstage');
    st.innerHTML=`<div class="tw" style="left:-10%">${svgWesen({element:s1.element,stage:s1.stage,form:s1.form,variant:s1.variant,glow:'hell',glowOp:1})}</div>
      <div class="tw" style="right:-10%">${svgWesen({element:s2.element,stage:s2.stage,form:s2.form,variant:s2.variant,glow:'hell',glowOp:1})}</div>`;

    $('#treffenmsg').textContent='';

      $('#treffenmsg').textContent=mc;

        s.needs.laune=clamp(s.needs.laune+10,10,100);
        s.stats.herz+=1;

      });
      if(S)S=loadProfile(P)||S;
      meta.treffenWindow=windowId(nowMs());saveMeta();

/* ============================================================
   BOOT: Verdrahtung, Zeittakt, Debug
   ============================================================ */
const Boot={
  catchupProfile(pid){
    const st=loadProfile(pid);if(!st)return;
    const oldWid=st.windowId;
    const t=nowMs();
    if(t>=st.lastSeen){
      const events=offlineCatchup(st);
      if(windowOf(t)==='morgen'&&/-nacht$/.test(oldWid)&&oldWid!==st.windowId)st.wakePending=true;
      events.forEach(ev=>{
        if(ev.typ==='bericht'){
          const prev=S;S=st;
          const rep=Actions.completeTask(ev.task);
          S=prev;
          st.pendingReport=rep;
          if(ev.task.type==='traum'&&windowOf(t)==='morgen')st.wakePending=true;
        }
      });
    } else { st.lastSeen=t; }
    save(pid,st);
  },
  enter(pid,fresh){
    this.catchupProfile(pid);
    P=pid;S=loadProfile(pid);
    if(!S){Start.render();return}
    meta.lastActive=pid;saveMeta();
    UI.show('home');
    Creature.mount();
    this.updateSoundBtn();
    UI.refreshHome();
    if(fresh){
      // Schlüpfen
      const w=$('#wesen');w.style.transform='scale(0)';w.style.transition='transform 1.1s cubic-bezier(.3,1.4,.5,1)';
      const r=w.getBoundingClientRect();
      setTimeout(()=>{w.style.transform='';UI.sparkleAt(r.left+r.width/2,r.top+r.height/2,ELEMENTS[S.element].farbe);
        Sound.freude();vibr([40,80,40]);},150);
      setTimeout(()=>{w.style.transition='';},1400);
      setTimeout(()=>{
        if(!S.seen.hilfe){S.seen.hilfe=true;saveNow();Help.open('bild');}
      },2600);
      return;
    }
    const proceed=()=>{
      if(S.wakePending){UI.status('Pssst. '+S.name+' schläft noch. Tipp es wach.',true);return}
      if(S.pendingReport){const rep=S.pendingReport;setTimeout(()=>Actions.showReport(rep),1200)}
    };
    if(Evo.ready())setTimeout(()=>Evo.run(proceed),900);
    else proceed();
  },
  tick(){
    if(!S||UI.screen!=='home')return;
    const t=nowMs();
    if(t>S.lastSeen)applyDecay(S,S.lastSeen,Math.min(t,S.lastSeen+14*36e5));
    const wid=windowId(t);
    if(wid!==S.windowId){
      const wasNight=/-nacht$/.test(S.windowId);
      S.windowId=wid;S.beats=beatsMax(windowOf(t));
      S.care={fensterId:wid,beatSpent:false,pet:false,wash:0,geweckt:false,gekaempft:false,gespielt:false};
      if(windowOf(t)==='morgen'&&wasNight)S.wakePending=true;
      Creature.render();UI.refreshHome();
      UI.toast(windowOf(t)==='morgen'?'Ein neuer Morgen.':windowOf(t)==='mittag'?'Mittagszeit.':windowOf(t)==='abend'?'Der Abend kommt.':'Nacht wird es.',2400);
    }
    if(S.task&&t>=S.task.end){
      const task=S.task;
      const rep=Actions.completeTask(task);
      if(task.type==='traum'&&windowOf(t)==='morgen'){
        S.pendingReport=rep;S.wakePending=true;
        Creature.render();UI.refreshHome();
        UI.status('Pssst. '+S.name+' träumt noch. Tipp es wach.',true);
      } else {
        Away.arrive();
        setTimeout(()=>Actions.showReport(rep),1150);
      }
    }
    if(S.task)Away.refresh();
    Creature.refreshGlow();
    saveNow();
  },
  updateSoundBtn(){
    const on=S&&S.settings.sound;
    $('#soundbtn').innerHTML=on
      ?'<svg viewBox="0 0 24 24" fill="none"><path class="st" d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4Z" stroke-width="2" stroke-linejoin="round"/><path class="st" d="M15.5 9c1.4 1.6 1.4 4.4 0 6M18 6.8c2.5 2.9 2.5 7.5 0 10.4" stroke-width="2" stroke-linecap="round"/></svg>'
      :'<svg viewBox="0 0 24 24" fill="none" opacity=".55"><path class="st" d="M4 9.5v5h3.5L12 19V5L7.5 9.5H4Z" stroke-width="2" stroke-linejoin="round"/><path class="st" d="M15.5 9.8 20 14.2M20 9.8l-4.5 4.4" stroke-width="2" stroke-linecap="round"/></svg>';
  },
  wire(){
    $('#homebtn').onclick=()=>{saveNow();S=null;P=null;Start.render()};
    $('#helpbtn').onclick=()=>Help.open();
    $('#soundbtn').onclick=()=>{S.settings.sound=!S.settings.sound;this.updateSoundBtn();saveNow();
      if(S.settings.sound)Sound.stimme()};
    $('#reportok').onclick=$('#reportclose').onclick=()=>{try{speechSynthesis.cancel()}catch(e){};UI.overlay('ov-report',false)};
    $('#readbtn').onclick=()=>Actions.readAloud();
    $('#sendok').onclick=()=>Actions.confirmSend();
    $('#sendclose').onclick=()=>UI.overlay('ov-send',false);
    $('#gameclose').onclick=()=>{cancelAnimationFrame(Games.raf);UI.overlay('ov-game',false);UI.refreshHome()};
    $('#helpclose').onclick=()=>UI.overlay('ov-help',false);
    $('#menuclose').onclick=()=>UI.overlay('ov-menu',false);
    $('#treffenok').onclick=()=>{UI.overlay('ov-treffen',false);Start.render()};
    $('#nameok').onclick=()=>{
      const n=$('#nameinput').value.trim().slice(0,12);
      if(!n){$('#nameinput').placeholder='Erst ein Name …';return}
      Ritual.finish(n);
    };
    $('#dicebtn').onclick=()=>{$('#nameinput').value=rnd(DATA.traeume.namen)};
    $('#actionrow').addEventListener('click',e=>{
      const b=e.target.closest('.pillbtn');if(!b)return;
      if(b.id==='act-send')Actions.openSend();
      if(b.id==='act-spiel')Games.open();
      if(b.id==='act-kampf')Battle.openWander();
      if(b.id==='act-traum')Actions.startTraum();
      if(b.id==='act-mehr')Menu.open();
    });
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden)saveNow();
      else{this.catchupVisible()}
    });
    window.addEventListener('pagehide',()=>saveNow());
  },
  catchupVisible(){
    if(S&&P){
      // längere Abwesenheit bei offener Seite: wie Neustart behandeln
      save(P,S);
      this.catchupProfile(P);
      S=loadProfile(P);
      Creature.render();UI.refreshHome();
      if(S.wakePending)UI.status('Pssst. '+S.name+' schläft. Tipp es wach.',true);
      else if(S.pendingReport){const rep=S.pendingReport;setTimeout(()=>Actions.showReport(rep),800)}
      if(Evo.ready())setTimeout(()=>Evo.run(),600);
    } else Start.render();
  },
  start(){
    UI.buildSkyDeco();
    this.wire();
    Gestures.init();
    ['p1','p2'].forEach(p=>this.catchupProfile(p));
    if(store.volatile)setTimeout(()=>UI.toast('Hinweis: Hier kann nichts dauerhaft gespeichert werden. Am Handy „Zum Startbildschirm hinzufügen“ nutzen.',5000),1500);
    Start.render();
    setInterval(()=>this.tick(),15000);
    setInterval(()=>Creature.tick(),500);
  },
};

/* ---------- Debug-API (nur mit #debug) ---------- */
if(DEBUG.on){
  window.G={
    get S(){return S}, get meta(){return meta}, store,
    off(h){DEBUG.offset+=h*36e5;Boot.tick();if(S){Creature.render();UI.refreshHome()}},
    setOff(ms){DEBUG.offset=ms;},
    beats(n){S.beats=n;UI.renderHearts();UI.renderActions()},
    need(k,v){S.needs[k]=v;Creature.render();},
    stat(k,v){S.stats[k]=v},
    counters(o){Object.assign(S.counters,o)},
    fenster(n){S.counters.fenster=n},
    finishTask(){if(S&&S.task){S.task.end=nowMs()-1;Boot.tick()}},
    evo(){Evo.run()},
    enter(p){Boot.enter(p)}, home(){Start.render()},
    tick(){Boot.tick()},
    reset(){try{['glimm.meta','glimm.p1','glimm.p2'].forEach(k=>localStorage.removeItem(k))}catch(e){};location.reload()},
    mkProfile(pid,name,elmt){const st=newState(name||'Testi',elmt||'glut');st.pref='sonnenbeere';save(pid||'p1',st);meta.profiles[pid||'p1']=st.name;saveMeta();Start.render()},
  };
}

document.addEventListener('DOMContentLoaded',()=>Boot.start());

/* ---------- PWA: Manifest + Icon zur Laufzeit erzeugen ----------
   Ein Data-URI-Manifest braucht absolute URLs; die kennen wir erst hier. */
(function pwa(){
  try{
    if(location.protocol!=='https:'&&location.hostname!=='localhost')return;
    const size=512, c=document.createElement('canvas');c.width=c.height=size;
    const x=c.getContext('2d');
    x.fillStyle='#141b33';
    const rr=size*0.22;
    x.beginPath();x.moveTo(rr,0);x.arcTo(size,0,size,size,rr);x.arcTo(size,size,0,size,rr);
    x.arcTo(0,size,0,0,rr);x.arcTo(0,0,size,0,rr);x.fill();
    // Körper
    x.fillStyle='#4a4560';
    x.beginPath();x.ellipse(size/2,size*0.62,size*0.27,size*0.24,0,0,7);x.fill();
    x.beginPath();x.arc(size/2,size*0.38,size*0.21,0,7);x.fill();
    // Ohren
    x.beginPath();x.ellipse(size*0.36,size*0.22,size*0.06,size*0.1,-0.3,0,7);x.fill();
    x.beginPath();x.ellipse(size*0.64,size*0.22,size*0.06,size*0.1,0.3,0,7);x.fill();
    // Glimmen
    const g=x.createRadialGradient(size/2,size*0.62,10,size/2,size*0.62,size*0.2);
    g.addColorStop(0,'#fff6e0');g.addColorStop(0.4,'rgba(255,179,92,.85)');g.addColorStop(1,'rgba(255,179,92,0)');
    x.fillStyle=g;x.beginPath();x.arc(size/2,size*0.62,size*0.2,0,7);x.fill();
    // Augen
    x.fillStyle='#f6efdd';
    x.beginPath();x.ellipse(size*0.43,size*0.38,size*0.035,size*0.045,0,0,7);x.fill();
    x.beginPath();x.ellipse(size*0.57,size*0.38,size*0.035,size*0.045,0,0,7);x.fill();
    x.fillStyle='#2b2836';
    x.beginPath();x.arc(size*0.43,size*0.385,size*0.018,0,7);x.fill();
    x.beginPath();x.arc(size*0.57,size*0.385,size*0.018,0,7);x.fill();
    const icon=c.toDataURL('image/png');
    const man={name:'GLIMM',short_name:'GLIMM',display:'standalone',orientation:'portrait',
      background_color:'#141b33',theme_color:'#141b33',
      start_url:location.href.split('#')[0],
      icons:[{src:icon,sizes:'512x512',type:'image/png'},{src:icon,sizes:'192x192',type:'image/png'}]};
    const link=document.createElement('link');link.rel='manifest';
    link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));
    document.head.appendChild(link);
    const ap=document.createElement('link');ap.rel='apple-touch-icon';ap.href=icon;
    document.head.appendChild(ap);
  }catch(e){}
})();
</script>
